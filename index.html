/* ---------- Cadastro ---------- */
VIEWS.cadastro=()=>{
  const tab=D.cadTab,q=D.cadBusca.trim().toLowerCase(),now=Date.now(),pq=normPlaca(q);
  const nc=Object.keys(S.clientes).length,nv=Object.keys(S.veiculos).length;
  const info=v=>{const vs=visitas(v.placa);return {...v,n:vs.length,gasto:vs.reduce((s,o)=>s+tot(o),0),ult:vs[0]?.entregueEm||0}};
  let body='';
  if(tab==='clientes'){
    let L=Object.values(S.clientes).map(c=>{const cs=carrosDo(c.id).map(info);return {...c,cs,n:cs.reduce((s,v)=>s+v.n,0),gasto:cs.reduce((s,v)=>s+v.gasto,0),ult:Math.max(0,...cs.map(v=>v.ult))}});
    if(q)L=L.filter(c=>(c.nome||'').toLowerCase().includes(q)||(soDig(q).length>=4&&soDig(c.telefone).includes(soDig(q)))||(pq.length>=3&&c.cs.some(v=>v.placa.includes(pq))));
    L.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    body=L.length?L.slice(0,200).map(c=>`<div class="linha"><div class="info"><b>${esc(c.nome)}</b><span class="muted small">${esc(c.telefone||'Sem WhatsApp')}, ${c.cs.length} ${c.cs.length===1?'carro':'carros'}, ${c.n} ${c.n===1?'visita':'visitas'}, ${brl(c.gasto)}</span>${c.obs?`<span class="small">${esc(c.obs)}</span>`:''}</div><div class="row">${c.cs.slice(0,2).map(v=>placa(v.placa,'xs')).join('')}</div><button class="btn sec sm" data-act="novoAg" data-cli="${c.id}">Agendar</button><button class="btn sm" data-act="go" data-v="cliente" data-id="${c.id}">Ver</button></div>`).join(''):`<div class="empty-big">${I.users}<p>Nenhum cliente encontrado.</p></div>`;
  }else{
    let L=Object.values(S.veiculos).map(info);
    if(q)L=L.filter(v=>(v.placa||'').includes(pq||'#')||(v.cliente||'').toLowerCase().includes(q)||(v.modelo||'').toLowerCase().includes(q));
    if(tab==='revisao')L=L.filter(v=>v.proxRevisao&&v.proxRevisao<now+15*DIA&&v.proxRevisao>now-60*DIA).sort((a,b)=>a.proxRevisao-b.proxRevisao);
    else if(tab==='sumidos')L=L.filter(v=>v.ult&&now-v.ult>180*DIA).sort((a,b)=>a.ult-b.ult);
    else L.sort((a,b)=>b.ult-a.ult||(a.placa||'').localeCompare(b.placa||''));
    body=L.length?L.slice(0,200).map(v=>`<div class="linha">${placa(v.placa,'sm')}<div class="info"><b>${esc(v.modelo)} ${esc(v.ano||'')}</b><span class="muted small">${esc(v.cliente)}, ${v.n} ${v.n===1?'visita':'visitas'}, ${brl(v.gasto)}${v.ult?', última '+fData(v.ult):''}${tab==='revisao'?', revisão '+fData(v.proxRevisao):''}</span></div>${v.telefone&&tab!=='veiculos'?`<button class="btn ok sm" data-act="waCli" data-p="${v.placa}" data-t="${tab}">${I.wa}Chamar</button>`:''}${v.clienteId?`<button class="btn sm" data-act="go" data-v="cliente" data-id="${v.clienteId}">Ver</button>`:''}</div>`).join('')
      :`<div class="empty-big">${I.oficina}<p>${tab==='revisao'?'Ninguém com revisão para os próximos 15 dias.':tab==='sumidos'?'Nenhum cliente sumido. Ótimo sinal!':'Nenhum carro encontrado.'}</p></div>`;
  }
  return `${cab('Cadastro',`${nc} ${nc===1?'cliente':'clientes'}, ${nv} ${nv===1?'veículo':'veículos'}`,{acao:`<button class="btn" data-act="novoCad">${I.plus}Novo cadastro</button>`})}
  <input data-b="cadBusca" data-live="render" value="${esc(D.cadBusca)}" placeholder="Procurar cliente, placa ou modelo" autocomplete="off">
  <div class="seg" style="margin-top:12px">${[['clientes',`Clientes (${nc})`],['veiculos',`Veículos (${nv})`],['revisao','Revisão chegando'],['sumidos','Sumidos há 6 meses']].map(([k,t])=>`<button class="${tab===k?'on':''}" data-act="setDraft" data-k="cadTab" data-v="${k}">${t}</button>`).join('')}</div>
  <section class="card lista" style="margin-top:14px">${body}</section>`;
};

  <div class="row" style="margin-top:14px">${c.telefone?`<button class="btn ok" data-act="waCliId" data-id="${id}">${I.wa}Chamar no WhatsApp</button>`:''}<button class="btn sec" data-act="go" data-v="novoCliente" data-id="${id}">Editar ou adicionar carro</button></div>
  <h2>Carros</h2><div class="card lista">${cs.length?cs.map(v=>`<div class="linha">${placa(v.placa,'sm')}<div class="info"><b>${esc(v.modelo)} ${esc(v.ano||'')} ${esc(v.cor||'')}</b><span class="muted small">${v.km?esc(v.km)+' km, ':''}${v.proxRevisao?'próxima revisão '+fData(v.proxRevisao):'sem revisão marcada'}</span></div><button class="btn sec sm" data-act="entradaPlaca" data-p="${v.placa}">${I.chegou}Dar entrada agora</button></div>`).join(''):'<p class="muted" style="margin:0">Nenhum carro cadastrado.</p>'}</div>
  ${agL.length?`<h2>Agendamentos marcados</h2><div class="card">${agL.map(a=>agLinha(a)).join('')}</div>`:''}
  <h2>Histórico</h2><div class="card lista">${all.length?all.map(o=>`<div class="linha"><div class="info"><b>Ordem nº ${o.numero}: ${fData(o.criadoEm)}, ${esc(o.placa)}</b><span class="muted">${(o.itens||[]).map(i=>esc(i.nome)).join(', ')||'Sem itens'}</span></div>${tag(o.status)}<b>${brl(tot(o))}</b><button class="btn sec sm" data-act="go" data-v="os" data-id="${o.id}">Abrir</button></div>`).join(''):'<p class="muted" style="margin:0">Sem visitas ainda.</p>'}</div>`;

/* ---------- Painel ---------- */
function periodo(){const h=hoje0();switch(D.pTab){case 'ontem':return [h-DIA,h,'ontem'];case 'semana':{const w=semana0();return [w,w+7*DIA,'nesta semana']}case 'mes':{const m=mes0(),d=new Date(m);d.setMonth(d.getMonth()+1);return [m,d.getTime(),'neste mês']}case 'dia':{const t=dYmd(D.pDia||hoje());return [t,t+DIA,'em '+fData(t)]}default:return [h,h+DIA,'hoje']}}
VIEWS.painel=()=>{
  const [a,b,lab]=periodo(),s=stats(a,b),prev=previsto(a,b),oc=ocupacao(a,b),now=Date.now(),h0=hoje0(),w0=semana0();
  const esta=stats(w0,now+1),antes=stats(w0-7*DIA,now-7*DIA+1),antesTotal=stats(w0-7*DIA,w0);
  const agN=ags().filter(x=>{const t=dYmd(x.data);return t>=a&&t<b&&x.status!=='cancelado'}).length;
  const exec=oss().filter(o=>o.status==='servico').length,atr=oss().filter(atrasado).length+ags().filter(agAtrasado).length;
  const kpi=(t,v,k,ic,d='')=>`<div class="kpi ${k}"><span class="ki">${ic}</span><div class="muted">${t}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`;
  const mecs=Object.entries(s.porMec).filter(([k])=>k!=='_').map(([k,v])=>({nome:nomeFunc(k)||'Sem nome',carros:v.carros.size,serv:v.serv,com:v.serv*(+func(k)?.comissao||0)/100})).sort((x,y)=>y.serv-x.serv);
  const topServ=Object.entries(s.porServ).sort((x,y)=>y[1]-x[1]).slice(0,6);
  const cmp=(t,x,y,f)=>`<tr><td>${t}</td><td class="n"><b>${f(x)}</b></td><td class="n">${f(y)}</td><td class="n">${variacao(x,y)}</td></tr>`;
  const inteiro=n=>String(Math.round(n)),dif=s.total-prev;
  const semTotal=stats(w0,w0+7*DIA).total,diasPass=Math.min(7,Math.floor((now-w0)/DIA)+1);
  return `${cab('Painel',hojeExtenso())}
  <section class="card filtro"><b>Data:</b>${[['hoje','Hoje'],['ontem','Ontem'],['semana','Esta semana'],['mes','Este mês']].map(([k,t])=>`<button class="btn sm ${D.pTab===k?'':'sec'}" data-act="setDraft" data-k="pTab" data-v="${k}">${t}</button>`).join('')}<label class="row" style="gap:8px"><span class="muted">Escolher dia</span><input type="date" value="${esc(D.pTab==='dia'?D.pDia:'')}" data-chg="pDia"></label></section>
  <section class="card"><div class="row between"><h3 style="margin:0">${I.trend}Faturamento da semana</h3><div style="text-align:right"><div class="muted small">Total da semana</div><div class="bignum money" style="font-size:30px">${brl(semTotal)}</div></div></div>${graficoSemana()}<p class="muted small" style="text-align:center;margin:6px 0 0">Média por dia até agora: ${brl(semTotal/diasPass)}.</p></section>
  <div class="kpis" style="margin-top:14px">
    ${kpi('Agendamentos '+lab,agN,'red',I.agenda)}
    ${kpi('Em serviço agora',exec,'amb',I.wrench)}
    ${kpi('Concluídos '+lab,s.carros,'grn',I.check)}
    ${kpi('Em atraso agora',atr,atr?'red':'gry',I.alert)}

function capTexto(){const c=CFG(),n=Math.max(1,Math.min(+c.boxes||1,+c.mecanicosDisp||+c.boxes||1));return `${c.boxes} ${+c.boxes===1?'box':'boxes'} e ${c.mecanicosDisp} ${+c.mecanicosDisp===1?'mecânico':'mecânicos'}: ${n} ${n===1?'carro':'carros'} ao mesmo tempo × ${fH(c.horasDia)} por dia`}
const DEFS=`<defs><linearGradient id="gO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4655"/><stop offset="1" stop-color="#E5212E" stop-opacity=".25"/></linearGradient><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5212E" stop-opacity=".35"/><stop offset="1" stop-color="#E5212E" stop-opacity="0"/></linearGradient><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
function gauge(p){return anel(p,'ocupação')}
function graficoSemana(){
  const w0=semana0(),d=[...Array(7)].map((_,i)=>{const a=w0+i*DIA;return {a,r:stats(a,a+DIA).total,p:previsto(a,a+DIA)}});
  const max=Math.max(1,...d.map(x=>Math.max(x.r,x.p)))*1.12,W=700,H=250,L=48,Rt=40,top=26,bot=38,hj=hoje0(),now=Date.now();
  const X=i=>L+i*((W-L-Rt)/6),Y=v=>top+(H-top-bot)*(1-v/max);
  const pr=d.filter(x=>x.a<=now);
  const lineR=pr.map((x,i)=>`${i?'L':'M'}${X(i)},${Y(x.r)}`).join(' ');
  const area=pr.length?`${lineR} L${X(pr.length-1)},${H-bot} L${X(0)},${H-bot} Z`:'';
  const lineP=d.map((x,i)=>`${i?'L':'M'}${X(i)},${Y(x.p)}`).join(' ');
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por dia desta semana">${DEFS}`;
  [0.25,0.5,0.75,1].forEach(f=>{s+=`<line x1="${L}" x2="${W-Rt}" y1="${Y(max*f/1.12)}" y2="${Y(max*f/1.12)}" stroke="var(--line)" stroke-dasharray="3 6"/>`});
  s+=`<path d="${lineP}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-dasharray="5 6" opacity=".7"/>`;
  if(area)s+=`<path d="${area}" fill="url(#gA)"/><path d="${lineR}" fill="none" stroke="#FF3342" stroke-width="3" filter="url(#gl)"/>`;
  d.forEach((x,i)=>{const isH=x.a===hj;if(x.a<=now){s+=`<circle cx="${X(i)}" cy="${Y(x.r)}" r="${isH?6:4.5}" fill="#0B0C10" stroke="#FF3342" stroke-width="2.5" filter="url(#gl)"/>`;if(x.r)s+=`<text x="${X(i)}" y="${Y(x.r)-14}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${curto(x.r).replace(/R\$\s?/,'')}</text>`}
    s+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="15" font-weight="${isH?700:400}" fill="${isH?'var(--brand-txt)':'var(--ink-2)'}">${DSEM[new Date(x.a).getDay()].slice(0,3)}</text>`});
  return s+`</svg><div class="row" style="justify-content:center;gap:22px;font-size:15px"><span class="row" style="gap:8px"><i style="width:22px;height:3px;background:#FF3342;box-shadow:0 0 8px #FF3342;display:inline-block"></i>Realizado</span><span class="row muted" style="gap:8px"><i style="width:22px;border-top:2px dashed var(--ink-2);display:inline-block"></i>Previsto</span></div>`;
}
function grafico8(){
  const w0=semana0(),ws=[];for(let k=7;k>=0;k--){const a=w0-k*7*DIA;ws.push({a,v:stats(a,a+7*DIA).total})}
  const meta=+S.config.meta||0,max=Math.max(meta,...ws.map(w=>w.v),1)*1.1;
  const W=680,H=260,top=30,bot=40,bw=50,gap=(W-40-bw*8)/7,y=v=>top+(H-top-bot)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento das últimas 8 semanas">${DEFS}`;
  ws.forEach((w,i)=>{const x=20+i*(bw+gap),cur=i===7;s+=`<rect x="${x}" y="${top}" width="${bw}" height="${H-bot-top}" rx="8" fill="var(--surface-2)"/><rect x="${x}" y="${y(w.v)}" width="${bw}" height="${Math.max(0,H-bot-y(w.v))}" rx="8" fill="url(#gO)" ${cur?'filter="url(#gl)"':'opacity=".6"'}/><text x="${x+bw/2}" y="${y(w.v)-8}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${w.v?curto(w.v).replace(/R\$\s?/,''):''}</text><text x="${x+bw/2}" y="${H-14}" text-anchor="middle" font-size="14" fill="${cur?'var(--brand-txt)':'var(--ink-2)'}" font-weight="${cur?700:400}">${cur?'Esta':fDM(w.a)}</text>`});
  if(meta)s+=`<line x1="10" x2="${W-10}" y1="${y(meta)}" y2="${y(meta)}" stroke="#FF5A4F" stroke-width="1.6" stroke-dasharray="8 6"/><text x="${W-12}" y="${y(meta)-6}" text-anchor="end" font-size="14" font-weight="700" fill="#FF8E86">Meta</text>`;
  return s+`</svg>`;
}

let DL=null;
function carregaJsPDF(){

}
async function pdfGuia(tipo,o){

  }else if(o.cliente)par('Cliente',o.cliente);
  const itensTab=its=>{doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setFillColor(245,245,247);doc.rect(M,y-5,W-2*M,8,'F');txt('Item',M+2,y);txt('Qtd',130,y,{align:'right'});txt('Valor',160,y,{align:'right'});txt('Total',W-M-2,y,{align:'right'});y+=8;
    its.forEach(i=>{const L=doc.splitTextToSize(i.nome,100);quebra(L.length*5+3);doc.setFont('helvetica','normal');doc.setFontSize(11);txt(L,M+2,y);txt(String(i.qtd),130,y,{align:'right'});txt(brl(i.preco),160,y,{align:'right'});txt(brl(i.qtd*i.preco),W-M-2,y,{align:'right'});y+=L.length*5+3;doc.setDrawColor(230);doc.line(M,y-2.5,W-M,y-2.5)})};
  const total=v=>{quebra(12);doc.setFont('helvetica','bold');doc.setFontSize(15);txt('Total: '+brl(v),W-M,y+4,{align:'right'});y+=12};
  if(tipo==='entrada'){

    y+=2;doc.setFontSize(10);const A=doc.splitTextToSize(aviso(),W-2*M-8);quebra(A.length*5+10);doc.setDrawColor(180);doc.setLineWidth(.3);doc.roundedRect(M,y-4,W-2*M,A.length*5+6,2,2);doc.setFont('helvetica','normal');txt(A,M+4,y+1);y+=A.length*5+8;
    const decl=doc.splitTextToSize('O cliente declara que o veículo foi entregue nas condições acima e concorda com o aviso de serviço adicional.',W-2*M);txt(decl,M,y);y+=decl.length*5+6;
    quebra(40);if(o.assinatura){try{doc.addImage(o.assinatura,'JPEG',M,y,70,25)}catch(e){console.error('assinatura',e)}}y+=27;doc.setDrawColor(40);doc.line(M,y,M+80,y);y+=5;doc.setFontSize(10);txt('Assinatura do cliente',M,y);

  }else{itensTab(o.itens||[]);total(o.total);par('Pagamento',PAG[o.pagamento]||'')}
  doc.setFontSize(8);doc.setTextColor(140);txt(of+' · documento gerado pelo sistema da oficina',W/2,292,{align:'center'});
  return doc.output('blob');

function nomePdf(tipo,o){return (tipo==='venda'?'comprovante-venda':(tipo==='entrada'?'guia-entrada':'guia-saida')+'-ordem-'+o.numero+'-'+(o.placa||''))+'.pdf'}
async function salvarPdf(blob,nome){
  try{DL=DL||(window.claude&&window.claude.use?await window.claude.use('downloads'):null)}catch(e){DL=null}
  if(DL){try{await DL.save({filename:nome,data:blob});return true}catch(e){if(e&&e.code==='declined')return false}}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){return false}
}

let REC=null;
function recBox(){const b=$('#audio-box');if(b)b.innerHTML=audioBox()}
async function startRec(tipo){
  if(REC)return;
  if(tipo==='texto'){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Este aparelho não transforma fala em texto aqui. Use o microfone do teclado.');return}
    let r;try{r=new SR()}catch(e){toast('Não consegui ligar o microfone.');return}
    r.lang='pt-BR';r.continuous=true;r.interimResults=false;
    r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t){D.chegou.queixa=((D.chegou.queixa||'').trim()+' '+t.trim()).trim();const ta=document.querySelector('[data-b="chegou.queixa"]');if(ta)ta.value=D.chegou.queixa}};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('O microfone não foi liberado. Permita o uso do microfone e tente de novo.');stopRec()};
    r.onend=()=>{if(REC&&REC.sr===r)stopRec()};
    try{r.start()}catch(e){toast('Não consegui ligar o microfone.');return}
    REC={tipo,sr:r,t0:Date.now()};
  }else{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Este aparelho não grava áudio aqui. Use o microfone do teclado.');return}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('O microfone não foi liberado. Permita o uso do microfone e tente de novo.');return}
    const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
    let mr;try{mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:16000}:{audioBitsPerSecond:16000})}catch(e){mr=new MediaRecorder(stream)}
    const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});const fr=new FileReader();fr.onload=()=>{if(String(fr.result).length>240000)toast('O áudio ficou grande demais. Grave uma explicação mais curta.');else D.chegou.audio=fr.result;recBox()};fr.readAsDataURL(blob)};
    mr.start(1000);REC={tipo,mr,t0:Date.now()};
  }
  REC.timer=setInterval(()=>{if(!REC)return;const s=Math.round((Date.now()-REC.t0)/1000),el=$('#rec-t');if(el)el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(REC.tipo==='audio'&&s>=60)stopRec()},500);
  recBox();
}
function stopRec(){if(!REC)return;const r=REC;REC=null;clearInterval(r.timer);try{r.sr&&r.sr.stop()}catch(e){}try{r.mr&&r.mr.state!=='inactive'&&r.mr.stop()}catch(e){}recBox()}

function initSig(){

  c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';
  if(D.chegou.assinatura){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=D.chegou.assinatura}
  let on=false,last=null;const pt=e=>{const b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
  c.onpointerdown=e=>{on=true;try{c.setPointerCapture(e.pointerId)}catch(_){}last=pt(e);e.preventDefault()};
  c.onpointermove=e=>{if(!on)return;const p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p};
  c.onpointerup=c.onpointercancel=()=>{if(!on)return;on=false;const o=document.createElement('canvas');o.width=520;o.height=Math.round(520*r.height/r.width);const ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,o.width,o.height);ox.drawImage(c,0,0,o.width,o.height);D.chegou.assinatura=o.toDataURL('image/jpeg',.7)};

let DRAG=null,SUPRIME=false;

function iniciaDrag(x,y){
  const d=DRAG;d.on=true;const r=d.card.getBoundingClientRect();
  d.ox=x-r.left;d.oy=y-r.top;d.g=d.card.cloneNode(true);d.g.classList.add('ghost');d.g.style.width=r.width+'px';d.g.removeAttribute('data-drag');document.body.appendChild(d.g);
  d.card.classList.add('dragging');d.ph=document.createElement('div');d.ph.className='ph';
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  moveDrag(x,y);

function moveDrag(x,y){
  const d=DRAG;d.g.style.left=(x-d.ox)+'px';d.g.style.top=(y-d.oy)+'px';
  const el=document.elementFromPoint(x,y),col=el&&el.closest('[data-col]');
  document.querySelectorAll('.col.over').forEach(c=>{if(c!==col)c.classList.remove('over')});
  if(col){col.classList.add('over');const cards=[...col.querySelectorAll('[data-drag]')].filter(c=>c!==d.card);let idx=cards.findIndex(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});
    if(idx<0){const last=cards[cards.length-1];if(last)last.after(d.ph);else col.querySelector('h3').after(d.ph)}else cards[idx].before(d.ph);
    d.col=col;d.idx=idx<0?cards.length:idx}else{d.ph.remove();d.col=null}

function fimDrag(soltar){
  const d=DRAG;DRAG=null;if(!d)return;clearTimeout(d.t);if(!d.on)return;

}

/* ============ Versão própria (Vercel): banco, IA e voz pelo servidor ============ */
const REMOTO=!window.claude&&/^https?:$/.test(location.protocol);
let SENHA=(()=>{try{return localStorage.getItem('oficina-senha')||''}catch(e){return ''}})(),LOGADO=false,VOZ_PRO=false;
async function apiPost(url,body,signal){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-senha':SENHA},body:JSON.stringify(body),signal});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.code||'erro');e.code=j.code||(r.status===401?'auth':'upstream_error');e.text=j.text;e.status=r.status;throw e}
  return j;
}
function criaDBRemoto(){
  const api=(op,b={})=>apiPost('/api/db',{op,...b});
  const subs={};let timer=null,rodando=false;
  async function sync(col){const s=subs[col];const r=await api('sync',{col,since:s.since});s.since=r.now;const ids=new Set(r.ids||[]);
    Object.keys(s.cache).forEach(k=>{if(!ids.has(k))delete s.cache[k]});Object.entries(r.docs||{}).forEach(([k,d])=>{if(d!=null)s.cache[k]=d});
    const docs=Object.entries(s.cache).map(([id,d])=>({id,exists:true,data:()=>d}));s.cbs.forEach(cb=>{try{cb(docs)}catch(e){console.error(e)}})}
  async function tick(){if(rodando||document.hidden)return;rodando=true;try{const r=await api('ver');const v=r.ver||{};for(const col of Object.keys(subs)){const nv=+(v[col]||0);if(subs[col].ver!==nv){subs[col].ver=nv;await sync(col)}}}catch(e){if(e.code==='auth')sairSistema()}finally{rodando=false}}
  function sub(col,cb){if(!subs[col]){subs[col]={cbs:[],ver:-1,since:0,cache:{}}}subs[col].cbs.push(cb);
    if(subs[col].cbs.length===1)sync(col).catch(e=>{if(e.code==='auth')sairSistema()});else{const docs=Object.entries(subs[col].cache).map(([id,d])=>({id,exists:true,data:()=>d}));if(subs[col].since)cb(docs)}
    if(!timer){timer=setInterval(tick,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}}
  const colRef=col=>({
    onSnapshot(cb){sub(col,docs=>cb({docs}));return()=>{}},
    get:async()=>{const r=await api('sync',{col,since:0});return {docs:Object.entries(r.docs||{}).map(([id,d])=>({id,data:()=>d}))}},
    doc(id){return {set:d=>api('set',{col,id,data:d}).then(()=>{}),delete:()=>api('del',{col,id}).then(()=>{}),
      get:async()=>{const r=await api('get',{col,id});return {exists:r.data!=null,data:()=>r.data}}}},
    where(f,op,v){return {get:async()=>{const r=await api('query',{col,field:f,value:v});return {docs:Object.entries(r.docs||{}).map(([id,d])=>({id,data:()=>d}))}}}}
  });
  return {remoto:true,collection:colRef,
    doc(path){const [col,id]=path.split('/');const ref=colRef(col).doc(id);return {...ref,onSnapshot(cb){sub(col,docs=>{const d=docs.find(x=>x.id===id);cb({exists:!!d,data:()=>d?d.data():undefined})});return()=>{}}}},
    bulk:async items=>{for(let k=0;k<items.length;k+=150)await api('bulk',{items:items.slice(k,k+150)})}};
}
function dataUrlB64(u){const m=/^data:([^;]+);base64,(.*)$/.exec(u||'');return m?{media_type:m[1],data:m[2]}:null}
function criaSampleRemoto(){return {limits:async()=>({images:{maxCount:1}}),
  json:async(turns,opts={})=>{let imagem=null;if(opts.images&&opts.images[0]){try{imagem=dataUrlB64(await comprimir(opts.images[0]))}catch(e){}}
    try{const j=await apiPost('/api/evo',{turns,imagem},opts.signal);return j.data}catch(e){if(e.name==='AbortError'){const x=new Error('cancelado');x.code='cancelled';throw x}throw e}}}}
function sairSistema(){try{localStorage.removeItem('oficina-senha')}catch(e){}SENHA='';LOGADO=false;render()}
function loginHTML(){return `<div style="max-width:440px;margin:8vh auto 0"><section class="card frame" style="padding:28px"><div class="row" style="margin-bottom:18px"><div class="mark" style="width:54px;height:54px;font-size:30px"><span>E</span></div><div><h1 style="font-size:24px">Sistema da oficina</h1><div class="muted">Digite a senha da oficina para entrar</div></div></div>
  <label class="f" style="margin-top:0">Senha</label><input type="password" id="senha-in" data-b="pin" value="${esc(D.pin||'')}" autocomplete="current-password" autofocus>
  <button class="btn big" style="margin-top:16px" data-act="entrarSistema">Entrar</button><p class="muted small" style="margin-top:12px">A senha é a que foi cadastrada na Vercel, no item APP_SENHA. Este aparelho fica lembrado.</p></section></div>`}
async function iniciaRemoto(){
  DB=criaDBRemoto();SAMPLE=criaSampleRemoto();EVO_IMG=true;
  try{const r=await fetch('/api/voz',{headers:{'x-senha':SENHA}});const j=await r.json();VOZ_PRO=!!j.ok}catch(e){VOZ_PRO=false}
  try{EVO_VOZ_AUTO=VOZ_PRO&&localStorage.getItem('oficina-evo-auto')!=='0'}catch(e){}
  ligaBanco();
}
function ligaBanco(){
  MODE='db';READY=0;MIGRADO=false;COLS.forEach(c=>S[c]={});S.config={};S.fotos={};S.audios={};render();
  const seen=new Set();const ok=k=>{if(!seen.has(k)){seen.add(k);READY++}};
  COLS.forEach(col=>DB.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[col]=o;ok(col);scheduleRender()},err=>{console.error(err);ok(col);toast('Perdi a conexão com os dados. Recarregue a página.')}));
  DB.doc('config/visual').onSnapshot(d=>{VISUAL=d.exists?d.data():{};scheduleRender()},()=>{});
  DB.doc('config/geral').onSnapshot(d=>{S.config=d.exists?d.data():{};ok('config');scheduleRender()},err=>{ok('config')});
}

aplicaTema();
if(REMOTO){
  render();
  if(SENHA)apiPost('/api/db',{op:'ver'}).then(()=>{LOGADO=true;iniciaRemoto()}).catch(e=>{if(e.code==='auth')sairSistema();else{LOGADO=true;iniciaRemoto();toast('Não consegui falar com o servidor. Confira a internet.')}});
}else{
  loadLocal();try{VISUAL=JSON.parse(localStorage.getItem('oficina-visual')||'{}')}catch(e){VISUAL={}}render();
  (async()=>{
    let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
    try{SAMPLE=window.claude&&window.claude.use?await window.claude.use('sample'):null;if(SAMPLE){const lim=await SAMPLE.limits().catch(()=>null);EVO_IMG=!!(lim&&lim.images)}}catch(e){SAMPLE=null}
    scheduleRender();
    if(!db)return;
    DB=db;ligaBanco();
  })();
}
</script>
</body>
</html>
