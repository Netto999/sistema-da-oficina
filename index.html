<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema da Oficina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080B;--side:rgba(10,11,14,.86);--surface:rgba(20,22,27,.78);--surface-solid:#121419;--surface-2:rgba(255,255,255,.035);--field:#0D0F13;
  --ink:#F5F5F6;--ink-2:#A3A7B0;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);--grid:rgba(255,255,255,.035);
  --brand:#E5212E;--brand-2:#FF4655;--brand-ink:#FFFFFF;--brand-soft:rgba(229,33,46,.13);--brand-txt:#FF6B75;--glow:rgba(229,33,46,.5);
  --ok:#1C9E53;--money:#5BE39A;
  --verde:#6FE0A0;--verde-bg:rgba(60,200,120,.13);--verm:#FF8E86;--verm-bg:rgba(255,80,70,.14);--ambar:#FFCB66;--ambar-bg:rgba(255,190,60,.13);--azul:#94BFFF;--azul-bg:rgba(90,150,255,.13);--cinza:#C7CCD4;--cinza-bg:rgba(255,255,255,.08);
  --t-red:rgba(255,80,70,.06);--t-amb:rgba(255,190,60,.06);--t-grn:rgba(60,200,120,.06);--t-blu:rgba(90,150,255,.06);--t-gry:rgba(255,255,255,.03);
  --plate:#1F4E9C;--disp:"Unbounded","Atkinson Hyperlegible",Verdana,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
:root[data-modo="claro"]{
  --bg:#ECEEF1;--side:rgba(255,255,255,.9);--surface:rgba(255,255,255,.9);--surface-solid:#FFFFFF;--surface-2:rgba(0,0,0,.03);--field:#FFFFFF;
  --ink:#121418;--ink-2:#545B66;--line:rgba(0,0,0,.1);--line-2:rgba(0,0,0,.18);--grid:rgba(0,0,0,.045);
  --brand:#D11A2A;--brand-2:#EF3340;--brand-soft:rgba(209,26,42,.1);--brand-txt:#B3121F;--glow:rgba(209,26,42,.3);
  --money:#15803D;--verde:#15803D;--verde-bg:#DCF2E3;--verm:#B42318;--verm-bg:#FBE3E0;--ambar:#8A5300;--ambar-bg:#FFF0C9;--azul:#1E4F91;--azul-bg:#E1EBF8;--cinza:#3F4B58;--cinza-bg:#E4E8EC;
  --t-red:#FDF1EF;--t-amb:#FFF8E6;--t-grn:#EFF8F2;--t-blu:#EEF3FB;--t-gry:#F6F7F9;color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",Tahoma,Arial,sans-serif;font-size:19px;line-height:1.45;-webkit-text-size-adjust:100%}
h1{font-size:30px;line-height:1.2;margin:0}
h2{font-size:23px;line-height:1.25;margin:32px 0 12px}
h3{font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h3 svg{width:24px;height:24px}
p{margin:0 0 10px}
.muted{color:var(--ink-2)}
.small{font-size:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto}
button{font:inherit;cursor:pointer}

/* Estrutura */
.shell{display:flex;min-height:100%}
.side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:15}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.mark{width:46px;height:46px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;transform:skewX(-8deg);flex:none}
.mark span{transform:skewX(8deg)}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand small{color:var(--brand-txt);font-weight:700;font-size:15px}
.nav{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 14px;border:none;border-radius:10px;background:transparent;color:var(--ink);font-size:18px;text-align:left}
.nav button svg{width:22px;height:22px;flex:none;opacity:.85}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--brand);color:#fff;font-weight:700}
.nav button.on svg{opacity:1}
.nav .count{margin-left:auto;background:var(--verm);color:#fff;border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;padding:0 8px}
.side-foot{padding:12px;border-top:1px solid var(--line);display:grid;gap:10px}
.ver{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--ink-2)}
.ver b{display:block;color:var(--ink)}
main{flex:1;min-width:0}
.mtop{display:none}
#app{max-width:1240px;margin:0 auto;padding:24px 24px 64px}
.backdrop{display:none}
@media(max-width:899px){
  .side{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .backdrop.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:14}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--side);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .mtop b{font-size:19px;flex:1}
  #app{padding:16px 14px 56px}
}
@media(min-width:900px){.mob{display:none!important}}
body.tv-mode .side,body.tv-mode .mtop{display:none}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 20px;border-radius:12px;border:2px solid transparent;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:19px;text-decoration:none;line-height:1.2;text-align:center}
.btn svg{width:24px;height:24px;flex:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:transparent;color:var(--verm);border-color:var(--verm)}
.btn.big{min-height:76px;font-size:23px;width:100%}
.btn.sm{min-height:46px;padding:6px 14px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:26px;height:26px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,textarea,select{font:inherit;font-size:20px;width:100%;min-height:58px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=date],input[type=time]{min-height:58px}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.8}
label.f{display:block;margin:16px 0 6px;font-weight:700}
.card{background:var(--surface);border-radius:14px;padding:20px;border:1px solid var(--line)}
.card+.card,.card+section,section+.card{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 16px}
.cols3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.cols3>*{margin-top:0!important;min-width:0}
.head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.head .t{flex:1 1 260px}
.head .t .muted{margin-top:4px}
.voltar{min-height:52px;padding:8px 16px}
.banner{background:var(--ambar-bg);color:var(--ambar);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700;font-size:17px}
.banner.info{background:var(--azul-bg);color:var(--azul)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:56px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;padding:8px 14px;font-size:18px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg.status button.on.st-verde{background:var(--ok);border-color:var(--ok)}
.seg.status button.on.st-verm{background:#B3261E;border-color:#B3261E}
.seg.status button.on.st-ambar{background:#A86A00;border-color:#A86A00}
.seg.inline button{flex:0 0 auto}

/* Início */
.hero{display:grid;gap:16px;margin-bottom:16px}
.hero .nums{display:flex;gap:32px;flex-wrap:wrap}
.bignum{font-size:36px;font-weight:700;line-height:1.1}
.money{color:var(--money)}
.bar{height:30px;background:var(--cinza-bg);border-radius:15px;overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:15px}
.bar.thin{height:10px;margin:6px 0 4px}
.bar.g>i{background:var(--ok)}.bar.a>i{background:#D99A00}.bar.r>i{background:#C62828}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:1000px){.home-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;min-height:150px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px;text-align:left;font-size:22px;font-weight:700;line-height:1.2;gap:12px}
.tile .ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand-txt)}
.tile .ic svg{width:32px;height:32px}
.tile.main{background:var(--brand);color:#fff;border-color:var(--brand)}
.tile.main .ic{background:rgba(255,255,255,.2);color:#fff}
.tile .sub{display:block;font-size:16px;font-weight:400;color:var(--ink-2);margin-top:4px}
.tile.main .sub{color:rgba(255,255,255,.9)}
.badge{position:absolute;top:16px;right:16px;min-width:40px;height:40px;border-radius:20px;background:var(--brand-soft);color:var(--brand-txt);display:flex;align-items:center;justify-content:center;font-size:20px;padding:0 12px}
.badge.alerta{background:#C62828;color:#fff}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}

/* Placa Mercosul */
.placa{display:inline-flex;flex-direction:column;background:#fff;border:3px solid #16191d;border-radius:8px;overflow:hidden;min-width:176px;text-align:center;color:#16191d;flex:none}
.placa .band{background:var(--plate);color:#fff;font-size:11px;font-weight:700;letter-spacing:.24em;padding:2px 0 1px;padding-left:.24em}
.placa .num{font-size:31px;font-weight:700;letter-spacing:.1em;padding:1px 12px 3px;padding-left:calc(12px + .1em)}
.placa.sm{min-width:122px;border-width:2px;border-radius:6px}
.placa.sm .num{font-size:21px;padding:0 8px 2px}
.placa.sm .band{font-size:8px}
.placa.xs{min-width:92px;border-width:2px;border-radius:5px}
.placa.xs .num{font-size:15px;padding:0 5px 1px;letter-spacing:.06em}
.placa.xs .band{font-size:6px}

/* Etiquetas */
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap}
.c-verde{background:var(--verde-bg);color:var(--verde)}
.c-verm{background:var(--verm-bg);color:var(--verm)}
.c-ambar{background:var(--ambar-bg);color:var(--ambar)}
.c-cinza{background:var(--cinza-bg);color:var(--cinza)}
.c-azul{background:var(--azul-bg);color:var(--azul)}

/* Oficina */
.kanban{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.col{background:var(--surface-2);border-radius:14px;padding:12px;border:1px solid var(--line)}
.col h3{justify-content:space-between}
.carcard{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;color:var(--ink)}
.carcard.late{border-color:var(--verm);border-width:3px}
.carcard .l{margin-top:6px;font-size:17px}
.empty{padding:16px;text-align:center;color:var(--ink-2);font-size:17px}
.empty-big{padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty-big>svg{width:52px;height:52px;opacity:.7;display:block;margin:0 auto 10px}

/* Arrastar e soltar */
.carcard[data-drag]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:grab}
.carcard.dragging{opacity:.3}
.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.4);transform:rotate(2deg);margin:0!important;cursor:grabbing}
.col.over{outline:3px dashed var(--brand);outline-offset:-3px;background:var(--brand-soft)}
.ph{height:8px;border-radius:4px;background:var(--brand);margin-top:10px}
.grip{float:right;color:var(--ink-2);font-size:20px;line-height:1;letter-spacing:-2px}
.dica svg{width:28px;height:28px;flex:none}
.dica{display:flex;gap:10px;align-items:center;background:var(--azul-bg);color:var(--azul);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700;font-size:17px}
/* Áudio */
.rec{background:#C62828!important;color:#fff!important;border-color:#C62828!important;animation:pulso 1.2s infinite}
@keyframes pulso{50%{opacity:.75}}
audio{width:100%;max-width:460px;margin-top:10px}
.aviso{border:1px solid #bbb;border-radius:6px;padding:10px 12px;font-size:14px;margin-top:12px}

/* Ordem */
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item .nome{flex:1 1 180px;font-weight:700}
.item .nome small{display:block;font-weight:400;color:var(--ink-2)}
.step{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:52px;height:52px;border:none;background:var(--surface-2);color:var(--ink);font-size:26px;font-weight:700}
.step span{min-width:44px;text-align:center;font-weight:700;font-size:20px}
.preco{width:130px;min-height:52px}
.x{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--verm);font-size:24px;font-weight:700}
.total{font-size:36px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chip{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:700;font-size:18px;text-align:left;position:relative}
.chip small{display:block;font-weight:400;color:var(--ink-2);font-size:16px;margin-top:2px}
.chip.semPreco small{color:var(--verm)}
.chip.on{border-color:var(--brand);background:var(--brand-soft)}
.chip.on::after{content:"✓";position:absolute;top:8px;right:12px;color:var(--brand-txt);font-size:20px}
.results{display:grid;gap:8px;margin-top:8px}
.results .chip{width:100%}
.fotos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.fotos .f{position:relative}
.fotos img{width:104px;height:104px;object-fit:cover;border-radius:10px;border:2px solid var(--line);display:block;cursor:zoom-in}
.fotos .f button{position:absolute;top:-8px;right:-8px;width:36px;height:36px;border-radius:18px;border:none;background:#B3261E;color:#fff;font-weight:700;font-size:18px}
.sig{display:block;width:100%;height:190px;background:#fff;border:2px dashed #9AA7B4;border-radius:10px;touch-action:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.overlay img{max-width:100%;max-height:100%;border-radius:8px}

/* Indicadores */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:18px}
td,th{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:16px;color:var(--ink-2);font-weight:700}
td.n,th.n{text-align:right;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{position:relative;border-radius:14px;padding:18px;border:1px solid var(--line);background:var(--surface)}
.kpi>.muted{padding-right:52px}
.kpi .v{font-size:31px;font-weight:700;line-height:1.15;margin-top:6px}
.kpi .d{font-size:16px;color:var(--ink-2);margin-top:4px}
.kpi .ki{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.kpi .ki svg{width:24px;height:24px}
.kpi.red{background:var(--t-red)}.kpi.red .ki{background:var(--verm-bg);color:var(--verm)}
.kpi.amb{background:var(--t-amb)}.kpi.amb .ki{background:var(--ambar-bg);color:var(--ambar)}
.kpi.grn{background:var(--t-grn)}.kpi.grn .ki{background:var(--verde-bg);color:var(--verde)}
.kpi.blu{background:var(--t-blu)}.kpi.blu .ki{background:var(--azul-bg);color:var(--azul)}
.kpi.gry{background:var(--t-gry)}.kpi.gry .ki{background:var(--cinza-bg);color:var(--cinza)}
.up{color:var(--verde);font-weight:700}
.down{color:var(--verm);font-weight:700}
.chart{width:100%;height:auto;display:block}
.filtro{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filtro input[type=date]{width:auto;min-height:52px}
.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pv>div{border-radius:12px;padding:14px;background:var(--surface-2);border:1px solid var(--line)}
.pv>div.real{background:var(--t-grn);border-color:transparent}
.pv .v{font-size:24px;font-weight:700;overflow-wrap:anywhere}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.lista .linha{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lista .linha:last-child{border-bottom:none}
.lista .linha .info{flex:1 1 200px}
.lista .linha .info b{display:block}
.alerta{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.alerta:last-child{border-bottom:none}
.alerta .dot{width:14px;height:14px;border-radius:7px;flex:none;margin-top:6px}
.alerta .dot.verm{background:#D23B2F}.alerta .dot.ambar{background:#D99A00}.alerta .dot.info{background:#3A7BD5}
.alerta .tx{flex:1 1 auto}
.alerta .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ok-state{text-align:center;padding:22px 8px;color:var(--ink-2)}
.ok-state svg{width:56px;height:56px;color:var(--verde);display:block;margin:0 auto 8px}

/* Agenda */
.semana-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
.semana{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}
.dia{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:300px;background:var(--surface)}
.dia:last-child{border-right:none}
.dia.hoje{background:var(--brand-soft)}
.dia .dh{text-align:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.dia .dh span{display:block;font-size:15px;color:var(--ink-2)}
.dia .dh b{font-size:26px}
.dia.hoje .dh b{color:var(--brand-txt)}
.dia .dc{padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px;text-align:center}
.dia .db{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.ag{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px;color:var(--ink);font-size:15px;line-height:1.3}
.ag b{font-size:16px}
.ag.chegou{border-left:5px solid var(--ok)}
.ag.agendado{border-left:5px solid var(--brand)}
.ag.walk{border-left:5px solid #8793A1}
.ag.late{border-left:5px solid #C62828;background:var(--verm-bg)}
.addday{margin-top:auto;min-height:44px;border:2px dashed var(--line);background:transparent;border-radius:10px;color:var(--ink-2);font-weight:700;font-size:16px}
.cap{border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--surface-2);border:1px solid var(--line)}
.cap.ruim{background:var(--verm-bg);border-color:transparent;color:var(--verm)}
.cap.bom{background:var(--verde-bg);border-color:transparent;color:var(--verde)}
.agrow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.agrow:last-child{border-bottom:none}
.quando{min-width:92px;text-align:center;border-radius:12px;background:var(--surface-2);padding:8px;border:1px solid var(--line)}
.quando b{display:block;font-size:22px}
.quando span{font-size:15px;color:var(--ink-2)}

/* Serviços */
.srvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.srv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px;width:100%}
.srv .tt{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.srv .tt svg{width:24px;height:24px;color:var(--brand-txt);flex:none}
.srv .ds{color:var(--ink-2);font-size:17px;min-height:24px}
.srv .ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.srv .ft span{display:flex;align-items:center;gap:6px}
.srv .ft svg{width:20px;height:20px}
.srv .pr{color:var(--money);font-weight:700;font-size:20px}

/* Guia */
.guia{background:#fff;color:#111;border:1px solid #ccc;border-radius:10px;padding:24px;max-width:760px;margin:0 auto}
.guia h2{margin:0 0 4px}
.guia table{font-size:16px}
.guia td,.guia th{border-color:#ddd;color:#111}
.guia .assin{max-width:320px;border-bottom:1px solid #111;display:block;margin-top:12px}
.guia .gtotal{font-size:28px;font-weight:700;text-align:right;margin-top:12px}

/* TV */
.tv h1{font-size:40px}
.tv .bar{height:44px;border-radius:22px}
.tv .bignum{font-size:54px}
.tv .carcard{font-size:22px}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#17191E;color:#fff;padding:16px 24px;border-radius:12px;font-weight:700;font-size:19px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ================= DESIGN EVOLUÇÃO: central de comando ================= */
html{background:var(--bg)}
body{background:transparent;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 620px at 88% -8%,rgba(229,33,46,.20),transparent 62%),
  radial-gradient(760px 520px at -8% 108%,rgba(229,33,46,.09),transparent 60%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/56px 56px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/56px 56px,var(--bg)}
:root[data-modo="claro"] body::before{background:radial-gradient(900px 620px at 88% -8%,rgba(209,26,42,.10),transparent 62%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/56px 56px,var(--bg)}
h1{font-family:var(--disp);font-weight:600;font-size:28px;letter-spacing:-.01em}
h2{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.005em}
.bignum{font-family:var(--disp);font-weight:600;letter-spacing:-.02em}
.kpi .v{font-family:var(--disp);font-weight:600;font-size:24px;letter-spacing:-.02em}
.total{font-family:var(--disp);font-weight:600;font-size:30px;letter-spacing:-.02em}
.glow{text-shadow:0 0 22px var(--glow)}
.money.glow{text-shadow:0 0 22px rgba(91,227,154,.35)}
.lbl{font-size:14px;color:var(--ink-2);letter-spacing:.03em;white-space:nowrap}
.lbl::before{content:"[ ";color:var(--brand-txt)}
.lbl::after{content:" ]";color:var(--brand-txt)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.strip .lbl:last-child{color:var(--ink);font-weight:700}
@media(max-width:899px){.strip{display:none}}

/* superfícies */
.card,.kpi,.col,.srv,.tile,.semana-wrap{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--surface);border:1px solid var(--line)}
:root[data-modo="claro"] .card,:root[data-modo="claro"] .kpi,:root[data-modo="claro"] .col,:root[data-modo="claro"] .srv,:root[data-modo="claro"] .tile:not(.main){background:var(--surface)}
.card{border-radius:16px}
.cap{background:var(--surface-2);border-color:var(--line)}
.cap.bom{background:var(--verde-bg)}.cap.ruim{background:var(--verm-bg)}
.frame{position:relative}
.frame::before,.frame::after{content:"";position:absolute;width:18px;height:18px;pointer-events:none}
.frame::before{top:-1px;left:-1px;border-top:2px solid var(--brand);border-left:2px solid var(--brand);border-top-left-radius:16px}
.frame::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--brand);border-right:2px solid var(--brand);border-bottom-right-radius:16px}

/* menu lateral */
.side{background:var(--side);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line)}
.brand{border-bottom:1px solid var(--line)}
.mark{background:linear-gradient(160deg,var(--brand-2),var(--brand));box-shadow:0 0 24px var(--glow);font-family:var(--disp)}
.brand b{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.01em}
.nav button{position:relative;color:var(--ink-2)}
.nav button svg{opacity:1}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:linear-gradient(90deg,rgba(229,33,46,.24),rgba(229,33,46,.03));color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px rgba(229,33,46,.25)}
.nav button.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--brand);box-shadow:0 0 12px var(--brand)}
.nav button.on svg{color:var(--brand-txt)}
.mtop{background:var(--side);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.ver{background:var(--surface-2)}

/* botões e campos */
.btn{background:linear-gradient(180deg,var(--brand-2),var(--brand));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 26px -10px var(--glow)}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface-2);border-color:var(--line-2);box-shadow:none;color:var(--ink)}
.btn.sec:hover{border-color:var(--brand);filter:none}
.btn.ok{background:linear-gradient(180deg,#27B863,#178A47);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 26px -12px rgba(39,184,99,.7)}
.btn.danger{background:transparent;box-shadow:none}
.icon-btn{background:var(--surface-2);border-color:var(--line-2)}
input,textarea,select{background:var(--field);border:1.5px solid var(--line-2)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
input[type=date],input[type=time]{color-scheme:inherit}
.seg button{background:var(--surface-2);border:1.5px solid var(--line-2)}
.seg button.on{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:var(--brand);box-shadow:0 0 18px -4px var(--glow)}
.chip{background:var(--surface-2);border:1.5px solid var(--line-2)}
.chip:hover{border-color:rgba(229,33,46,.6)}
.chip.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 20px -6px var(--glow)}
.step{border-color:var(--line-2)}.step button{background:var(--surface-2)}
.x{background:var(--surface-2);border-color:var(--line-2)}
.banner{background:var(--ambar-bg);border:1px solid rgba(255,190,60,.25)}
.banner.info,.dica{background:var(--azul-bg);border:1px solid rgba(90,150,255,.25)}
.tag{border:1px solid rgba(255,255,255,.06)}
.bar{background:var(--cinza-bg)}
.bar>i{background:linear-gradient(90deg,var(--brand),var(--brand-2));box-shadow:0 0 14px var(--glow)}
.bar.g>i{background:linear-gradient(90deg,#1C9E53,#5BE39A);box-shadow:0 0 12px rgba(91,227,154,.4)}
.bar.a>i{background:linear-gradient(90deg,#D99A00,#FFCB66)}.bar.r>i{background:linear-gradient(90deg,#C62828,#FF6A5F);box-shadow:0 0 12px rgba(255,80,70,.5)}
#toast{background:rgba(18,20,25,.94);border:1px solid rgba(229,33,46,.5);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px -6px var(--glow)}
table td,table th{border-color:var(--line)}
.item,.lista .linha,.alerta,.agrow{border-color:var(--line)}
.head .t .muted{font-size:17px}

/* indicadores */
.kpi{--acc:var(--brand);border-radius:16px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.kpi.red{--acc:#FF6A5F}.kpi.amb{--acc:#FFB636}.kpi.grn{--acc:#43D385}.kpi.blu{--acc:#6FA8FF}.kpi.gry{--acc:rgba(255,255,255,.35)}
.kpi.red,.kpi.amb,.kpi.grn,.kpi.blu,.kpi.gry{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--surface)}
.kpi .ki{background:transparent!important;border:1px solid var(--acc);color:var(--acc)!important;box-shadow:0 0 16px -6px var(--acc)}
.pv>div{background:var(--surface-2)}
.pv>div.real{background:var(--verde-bg)}

/* pátio e agenda */
.col{border-radius:16px}
.col.over{background:var(--brand-soft)}
.carcard{background:var(--surface-solid);border:1.5px solid var(--line-2);border-radius:14px}
.carcard:hover{border-color:rgba(229,33,46,.6)}
.carcard.late{border-color:#FF5A4F;box-shadow:0 0 22px -8px rgba(255,80,70,.7)}
.ph{box-shadow:0 0 14px var(--brand)}
.semana-wrap{border-radius:16px}
.dia{background:transparent;border-color:var(--line)}
.dia .dh,.dia .dc{border-color:var(--line)}
.dia.hoje{background:linear-gradient(180deg,rgba(229,33,46,.16),rgba(229,33,46,.02));box-shadow:inset 0 2px 0 var(--brand)}
.ag{background:var(--surface-solid);border-color:var(--line-2)}
.ag.late{background:var(--verm-bg)}
.quando{background:var(--surface-2);border-color:var(--line-2)}
.quando b{font-family:var(--disp);font-weight:600;font-size:19px}
.srv{border-radius:16px}.srv:hover{border-color:rgba(229,33,46,.6)}
.srv .ft{border-color:var(--line)}
.addday{border-color:var(--line-2)}

/* ===== central de comando (início) ===== */
.cmd{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:46px 38px;margin:6px 0 10px}
.cmd>*{position:relative;z-index:1}
.cmd .wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.wires .w{fill:none;stroke:rgba(229,33,46,.32);stroke-width:1.5}
.wires .f{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-dasharray:10 150;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--brand));animation:flui 3.2s linear infinite}
.wires .d{fill:var(--brand);filter:drop-shadow(0 0 5px var(--brand))}
@keyframes flui{to{stroke-dashoffset:-160}}
.hub{grid-column:2;grid-row:2;border-radius:20px;padding:22px 22px 20px;text-align:center;background:radial-gradient(420px 260px at 50% 0%,rgba(229,33,46,.16),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--surface);border:1px solid rgba(229,33,46,.35);box-shadow:0 0 60px -20px var(--glow)}
.hub .lbl{display:block;margin-bottom:6px}
.hub .ring{display:flex;justify-content:center;margin:4px 0 8px}
.hub .hoje-v{font-size:34px;line-height:1.1}
.hub .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hub .mini>div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.hub .mini b{display:block;font-family:var(--disp);font-weight:600;font-size:17px;margin-top:2px}
.hub .foot{margin-top:12px;font-size:16px}
.t1{grid-column:1;grid-row:1}.t2{grid-column:2;grid-row:1}.t3{grid-column:3;grid-row:1}.t4{grid-column:1;grid-row:2;align-self:center}.t5{grid-column:3;grid-row:2;align-self:center}.t6{grid-column:1;grid-row:3}.t7{grid-column:2;grid-row:3}.t8{grid-column:3;grid-row:3}
.tile{min-height:132px;border-radius:18px;padding:16px 18px;gap:10px;font-size:21px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:rgba(229,33,46,.65);box-shadow:0 0 34px -12px var(--glow);transform:translateY(-2px)}
.tile .lbl{font-size:13px;font-weight:400}
.tile .ic{width:50px;height:50px;border-radius:13px;background:transparent;border:1.5px solid rgba(229,33,46,.55);color:var(--brand-txt);box-shadow:0 0 18px -6px var(--glow)}
.tile .ic svg{width:28px;height:28px}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.tile .sub{font-size:16px}
.tile.main{background:radial-gradient(260px 160px at 80% 0%,rgba(255,255,255,.22),transparent 70%),linear-gradient(160deg,var(--brand-2),var(--brand) 60%,#9E111C);border-color:rgba(255,130,140,.6);box-shadow:0 18px 44px -16px var(--glow)}
.tile.main .ic{border-color:rgba(255,255,255,.6);color:#fff;box-shadow:none}
.tile.main .lbl,.tile.main .lbl::before,.tile.main .lbl::after{color:rgba(255,255,255,.85)}
.badge{position:static;background:var(--brand-soft);color:var(--brand-txt);border:1px solid rgba(229,33,46,.35);min-width:38px;height:38px;font-size:18px}
.badge.alerta{background:#D92D20;color:#fff;border-color:transparent;box-shadow:0 0 18px -2px rgba(217,45,32,.8)}
@media(max-width:1099px){
  .cmd{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .cmd .wires{display:none}
  .hub{grid-column:1/-1;grid-row:1}
  .t1,.t2,.t3,.t4,.t5,.t6,.t7,.t8{grid-column:auto;grid-row:auto;align-self:stretch}
}

/* hero da central */
.hero3{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;margin-bottom:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:10px;align-items:center;
  background:radial-gradient(600px 300px at 78% 60%,rgba(229,33,46,.22),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line)}
.hero3::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px;mask-image:linear-gradient(90deg,transparent 30%,#000 70%);-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 70%)}
.hero3>*{position:relative;z-index:1}
.hero3.so-texto{grid-template-columns:1fr}
.hero3.so-texto .sub3{max-width:60ch}
.hero3 .nome{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.2vw,54px);line-height:1.02;letter-spacing:-.03em;margin:10px 0 12px;text-transform:uppercase}
.hero3 .nome em{font-style:normal;color:var(--brand);text-shadow:0 0 28px var(--glow)}
.hero3 .sub3{color:var(--ink-2);max-width:40ch;margin-bottom:18px}
.hero3 .img3{position:relative;min-height:220px;display:flex;align-items:center;justify-content:center}
.hero3 .img3 img{width:100%;max-height:320px;object-fit:cover;border-radius:14px;mask-image:linear-gradient(90deg,transparent,#000 22%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 92%,transparent)}
.tv .tvcar.foto{opacity:.32;width:min(1100px,80vw);right:0;bottom:0}
.tv .tvcar.foto img{mask-image:radial-gradient(closest-side,#000 55%,transparent);-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent)}
.imgslot{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
.imgslot .prev{aspect-ratio:16/9;border-radius:12px;border:1.5px dashed var(--line-2);background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--ink-2);margin:8px 0}
.carro-neon{width:100%;max-width:560px;height:auto;overflow:visible}
.carro-neon .c{fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--brand)) drop-shadow(0 0 16px var(--glow))}
.carro-neon .c2{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.3;stroke-linecap:round}
.carro-neon .g{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 6}
.carro-neon .t{fill:var(--ink-2);font-size:12px;letter-spacing:.04em}
.carro-neon .p{fill:var(--brand);filter:drop-shadow(0 0 5px var(--brand))}
.carro-neon .desenha{stroke-dasharray:1600;stroke-dashoffset:1600;animation:desenha 2.4s ease-out .15s forwards}
.carro-neon .scan{fill:url(#scanG);animation:scan 4.5s ease-in-out 2.4s infinite}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes scan{0%{transform:translateX(-120px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(600px);opacity:0}}
@media(max-width:899px){.hero3{grid-template-columns:1fr;padding:20px}.hero3 .img3{min-height:0}}
.cn{max-width:640px}
.cn .cn-glow{filter:drop-shadow(0 0 5px #E5212E)}
.cn .cn-line{stroke-width:2.6}
.cn .desenha{stroke-dasharray:2200;stroke-dashoffset:2200;animation:desenha 2.6s cubic-bezier(.6,0,.2,1) .1s forwards}
.cn .desenha2{stroke-dasharray:1400;stroke-dashoffset:1400;animation:desenha 2s ease-out .9s forwards}
.cn.cn-anim .cn-fill,.cn.cn-anim .cn-head,.cn.cn-anim .cn-tail{opacity:0;animation:aparece .8s ease 2s forwards}
.cn .cn-head{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #FF4655)}
.cn .cn-tail{filter:drop-shadow(0 0 8px #FF2E3F);animation:cnTail 2.4s ease-in-out infinite}
.cn.cn-anim .cn-tail{animation:aparece .8s ease 2s forwards,cnTail 2.4s ease-in-out 2.8s infinite}
.cn .cn-wheel{transform-box:fill-box;transform-origin:center;animation:cnSpin .9s linear infinite}
.cn .cn-hud,.cn .cn-hud2{transform-box:view-box}
.cn .cn-hudg{transform-box:fill-box;transform-origin:center;animation:cnSpin 7s linear infinite reverse}
.cn .cn-road{animation:cnRoad .5s linear infinite}
.cn .cn-streak{animation:cnStreak 1.3s linear infinite;opacity:0}
.cn .cn-body{animation:cnBob 1.6s ease-in-out infinite}
.cn .cn-beam{animation:cnBeam 3.6s ease-in-out infinite}
.cn .cn-refl{animation:cnBeam 3s ease-in-out infinite}
.cn .cn-scan{animation:cnScan 8s cubic-bezier(.45,0,.55,1) infinite}
.cn .cn-node{opacity:0;animation:cnNode 8s ease infinite;animation-delay:var(--d)}
.cn .cn-call{stroke-dasharray:140;stroke-dashoffset:140;animation:cnCall 8s ease infinite;animation-delay:var(--d)}
.cn .cn-ring{transform-box:fill-box;transform-origin:center;animation:cnRing 1.4s ease-out infinite}
.cn .cn-ok{fill:#6FE0A0;font-size:11px;letter-spacing:.03em}
.cn .cn-prog{transform-box:fill-box;transform-origin:left center;animation:cnProg 8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes aparece{to{opacity:1}}
@keyframes cnSpin{to{transform:rotate(360deg)}}
@keyframes cnRoad{to{stroke-dashoffset:120}}
@keyframes cnStreak{0%{transform:translateX(40px);opacity:0}25%{opacity:.9}100%{transform:translateX(-90px);opacity:0}}
@keyframes cnBob{50%{transform:translateY(-1.6px)}}
@keyframes cnBeam{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes cnTail{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes cnScan{0%{transform:translateX(0);opacity:0}6%{opacity:1}50%{transform:translateX(660px);opacity:1}56%{transform:translateX(660px);opacity:0}100%{transform:translateX(660px);opacity:0}}

/* ============ Dados ============ */
const COLS=['os','veiculos','clientes','pecas','servicos','funcionarios','vendas','agenda'];
const S={os:{},veiculos:{},clientes:{},pecas:{},servicos:{},funcionarios:{},vendas:{},agenda:{},config:{},fotos:{},audios:{}};
let VISUAL={};
let DB=null,MODE='local',READY=0,UNLOCK=false,pendingRender=false,MIGRADO=false;
const LS='oficina-sistema-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j)for(const k in S)if(j[k])S[k]=j[k]}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('A memória deste aparelho está cheia. Apague fotos antigas.')}}
const chains={};
function dbErr(e){console.error(e);if(e&&e.code==='quota_exceeded')toast('O espaço do sistema está cheio. Avise o dono.');else toast('Não consegui salvar. Confira a internet e tente de novo.')}
function put(col,id,data){
  S[col]={...S[col],[id]:data};
  if(MODE==='db'){const k=col+'/'+id;chains[k]=(chains[k]||Promise.resolve()).then(()=>DB.collection(col).doc(id).set(clone(data))).catch(dbErr);return chains[k]}
  saveLocal();return Promise.resolve();
}
function del(col,id){
  const n={...S[col]};delete n[id];S[col]=n;
  if(MODE==='db'){const k=col+'/'+id;chains[k]=(chains[k]||Promise.resolve()).then(()=>DB.collection(col).doc(id).delete()).catch(dbErr);return chains[k]}
  saveLocal();return Promise.resolve();
}
function putVisual(v){VISUAL=v;if(MODE==='db')return DB.doc('config/visual').set(clone(v)).catch(dbErr);try{localStorage.setItem('oficina-visual',JSON.stringify(v))}catch(e){toast('Imagem grande demais para guardar neste aparelho')}return Promise.resolve()}
function putConfig(c){S.config=c;if(MODE==='db')return DB.doc('config/geral').set(clone(c)).catch(dbErr);saveLocal();return Promise.resolve()}
function putFoto(id,data){if(MODE==='db')return DB.collection('fotos').doc(id).set(data).catch(dbErr);S.fotos[id]=data;saveLocal();return Promise.resolve()}
function putAudio(id,data){if(MODE==='db')return DB.collection('audios').doc(id).set(data).catch(dbErr);(S.audios=S.audios||{})[id]=data;saveLocal();return Promise.resolve()}
async function getAudios(osId){
  if(MODE==='db'){try{const s=await DB.collection('audios').where('osId','==',osId).get();return s.docs.map(d=>d.data().audio)}catch(e){return []}}
  return Object.values(S.audios||{}).filter(f=>f.osId===osId).map(f=>f.audio);
}
async function getFotos(osId){
  if(MODE==='db'){try{const s=await DB.collection('fotos').where('osId','==',osId).get();return s.docs.map(d=>d.data().img)}catch(e){return []}}
  return Object.values(S.fotos).filter(f=>f.osId===osId).map(f=>f.img);
}
function ensureCliente(nome,tel){
  const d=soDig(tel),n=(nome||'').trim().toLowerCase();
  let c=Object.values(S.clientes).find(c=>d&&soDig(c.telefone)===d)||Object.values(S.clientes).find(c=>n&&(c.nome||'').trim().toLowerCase()===n);
  if(c){if(!c.telefone&&tel)put('clientes',c.id,{...clone(c),telefone:tel});return c.id}
  const id=uid();put('clientes',id,{id,nome:(nome||'').trim(),telefone:(tel||'').trim(),obs:'',criadoEm:Date.now()});return id;
}
function migrar(){if(MIGRADO)return;MIGRADO=true;Object.values(S.veiculos).forEach(v=>{if(!v.clienteId&&v.cliente){const cid=ensureCliente(v.cliente,v.telefone);put('veiculos',v.placa,{...clone(v),clienteId:cid})}})}

const ST={aguardando:{t:'Aguardando',c:'c-cinza',b:''},servico:{t:'Em serviço',c:'c-ambar',b:'st-ambar'},peca:{t:'Esperando peça',c:'c-verm',b:'st-verm'},aprovacao:{t:'Esperando o cliente aprovar',c:'c-verm',b:'st-verm'},pronto:{t:'Pronto',c:'c-verde',b:'st-verde'},entregue:{t:'Entregue',c:'c-verde',b:''},cancelado:{t:'Cancelado',c:'c-cinza',b:''}};
const ORDEM=['aguardando','servico','peca','aprovacao','pronto'];
const PAG={pix:'Pix',dinheiro:'Dinheiro',debito:'Cartão de débito',credito:'Cartão de crédito',fiado:'Fiado'};
const AVISO_PADRAO='Serviço adicional: se durante o conserto for encontrado outro problema, o cliente autoriza a oficina a fazer o serviço necessário mediante aviso prévio por WhatsApp ou telefone, informando o que será feito e o valor.';
const aviso=()=>(S.config.avisoOS||AVISO_PADRAO).trim();
const DSEM=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const isOpen=o=>o.status!=='entregue'&&o.status!=='cancelado';
const sub=o=>(o.itens||[]).reduce((a,i)=>a+(+i.qtd||0)*(+i.preco||0),0);
const tot=o=>Math.max(0,sub(o)-(+o.desconto||0));
const oss=()=>Object.values(S.os);
const ags=()=>Object.values(S.agenda);
const func=id=>S.funcionarios[id];
const nomeFunc=id=>func(id)?.nome||'';
const podeVerLucro=()=>!S.config.pin||UNLOCK;
const agVal=a=>(a.itens||[]).reduce((s,i)=>s+(+i.preco||0),0);
const hItens=it=>(it||[]).reduce((a,i)=>a+(i.tipo==='peca'?0:(+i.horas||0)*(+i.qtd||1)),0);
const agAtivo=a=>a.status==='agendado'||a.status==='chegou';
const CFG=()=>({boxes:1,mecanicosDisp:1,abertura:'08:00',fechamento:'18:00',horasDia:8,dias:[1,2,3,4,5,6],...S.config});
function capDia(s){const c=CFG(),wd=new Date(dYmd(s)).getDay();if(!(c.dias||[]).includes(wd))return 0;return Math.max(1,Math.min(+c.boxes||1,+c.mecanicosDisp||+c.boxes||1))*(+c.horasDia||8)}
function usoDia(s,exceto){let h=0;ags().forEach(a=>{if(a.id!==exceto&&a.data===s&&agAtivo(a))h+=hItens(a.itens)});oss().forEach(o=>{if(!o.agendaId&&o.status!=='cancelado'&&ymd(o.criadoEm)===s)h+=hItens(o.itens)});return h}
function proxVaga(from,need,exceto){for(let i=0;i<90;i++){const s=addDias(from,i),c=capDia(s);if(c>0&&c-usoDia(s,exceto)>=need)return s}return null}
function atrasado(o){if(!isOpen(o))return false;if(o.previsao&&o.status!=='pronto')return Date.now()>dYmd(o.previsao)+DIA;if(o.status==='pronto')return Date.now()-(o.statusEm||o.criadoEm)>DIA;return Date.now()-o.criadoEm>2*DIA}
function agAtrasado(a){if(a.status!=='agendado')return false;if(!a.hora)return Date.now()>dYmd(a.data)+hm(CFG().fechamento||'18:00');return Date.now()>dYmd(a.data)+hm(a.hora)+30*6e4}
const CANAL={ligacao:'Ligação',whatsapp:'WhatsApp',presencial:'Na hora'};
const agCarro=(a,cls='sm')=>a.placa&&a.placa.length===7?placa(a.placa,cls):`<span class="semplaca ${cls}">${esc(a.placa||'sem placa')}</span>`;
function agStatus(a){
  if(a.status==='chegou'){const o=S.os[a.osId];if(o&&o.status==='entregue')return ['Concluído','c-verde'];if(o&&o.status==='cancelado')return ['Cancelado','c-cinza'];return ['Na oficina','c-ambar']}
  if(a.status==='cancelado')return ['Cancelado','c-cinza'];if(a.status==='faltou')return ['Faltou','c-cinza'];
  return agAtrasado(a)?['Atrasado','c-verm']:['Agendado','c-azul'];
}
function stats(a,b){
  const L=oss().filter(o=>o.status==='entregue'&&o.entregueEm>=a&&o.entregueEm<b);
  const V=Object.values(S.vendas).filter(v=>v.criadoEm>=a&&v.criadoEm<b);
  let serv=0,peca=0,balcao=0,custo=0,tempo=0,voltaram=0;const pag={},porMec={},porServ={};
  L.forEach(o=>{
    const s=sub(o),f=s>0?tot(o)/s:0;
    (o.itens||[]).forEach(i=>{const v=(+i.qtd||0)*(+i.preco||0)*f;
      if(i.tipo==='peca'){peca+=v;custo+=(+i.qtd||0)*(+i.custo||0)}
      else{serv+=v;porServ[i.nome]=(porServ[i.nome]||0)+v;const m=o.mecanicoId||'_';porMec[m]=porMec[m]||{carros:new Set(),serv:0};porMec[m].serv+=v}});
    if(o.mecanicoId){porMec[o.mecanicoId]=porMec[o.mecanicoId]||{carros:new Set(),serv:0};porMec[o.mecanicoId].carros.add(o.id)}
    pag[o.pagamento||'pix']=(pag[o.pagamento||'pix']||0)+tot(o);
    tempo+=(o.entregueEm-o.criadoEm);
    if(oss().some(x=>x.id!==o.id&&x.placa===o.placa&&x.status==='entregue'&&x.entregueEm<o.criadoEm))voltaram++;
  });
  V.forEach(v=>{peca+=+v.total||0;balcao+=+v.total||0;(v.itens||[]).forEach(i=>custo+=(+i.qtd||0)*(+i.custo||0));pag[v.pagamento||'pix']=(pag[v.pagamento||'pix']||0)+(+v.total||0)});
  const total=serv+peca,atend=L.length+V.length;
  return {total,serv,peca,balcao,custo,lucro:total-custo,carros:L.length,vendas:V.length,atend,ticket:atend?total/atend:0,tempo:L.length?tempo/L.length:0,retorno:L.length?voltaram/L.length*100:0,pag,porMec,porServ};
}
function previsto(a,b){let v=0;ags().forEach(x=>{const t=dYmd(x.data);if(t>=a&&t<b&&agAtivo(x))v+=agVal(x)});oss().forEach(o=>{if(!o.agendaId&&o.status!=='cancelado'&&o.criadoEm>=a&&o.criadoEm<b)v+=tot(o)});return v}
function ocupacao(a,b){let u=0,c=0;for(let t=a;t<b;t+=DIA){const s=ymd(t+3600e3);u+=usoDia(s);c+=capDia(s)}return {u,c,p:c?u/c*100:0}}
function variacao(a,b){if(!b)return a>0?'<span class="up">novo</span>':'<span class="muted">igual</span>';const p=(a-b)/b*100;if(Math.abs(p)<.5)return '<span class="muted">igual</span>';return p>0?`<span class="up">▲ ${Math.round(p)}%</span>`:`<span class="down">▼ ${Math.round(-p)}%</span>`}
function varTxt(a,b){if(!b)return a>0?'(sem base para comparar)':'';const p=Math.round((a-b)/b*100);return p>0?`(subiu ${p}%)`:p<0?`(caiu ${-p}%)`:'(igual)'}
function visitas(placa){return oss().filter(o=>o.placa===placa&&o.status==='entregue').sort((a,b)=>b.entregueEm-a.entregueEm)}
function carrosDo(cid){return Object.values(S.veiculos).filter(v=>v.clienteId===cid)}
function pendencias(){
  const O=oss();
  return {
    peca:O.filter(o=>o.status==='peca'),
    aprov:O.filter(o=>o.status==='aprovacao'),
    pronto:O.filter(o=>o.status==='pronto'),
    fiado:[...O.filter(o=>o.status==='entregue'&&o.pagamento==='fiado'&&!o.pago).map(o=>({col:'os',id:o.id,nome:o.cliente,placa:o.placa,valor:tot(o),em:o.entregueEm,tel:o.telefone})),
           ...Object.values(S.vendas).filter(v=>v.pagamento==='fiado'&&!v.pago).map(v=>({col:'vendas',id:v.id,nome:v.cliente||'Venda no balcão',valor:v.total,em:v.criadoEm,tel:v.telefone}))],
    comprar:Object.values(S.pecas).filter(p=>(+p.qtd||0)<=(+p.minimo||0))
  };
}
function contaPend(){const p=pendencias();return p.peca.length+p.aprov.length+p.pronto.filter(atrasado).length+p.fiado.length+p.comprar.length}
function alertas(){
  const A=[],now=Date.now(),h=hoje(),p=pendencias();
  ags().filter(agAtrasado).sort((a,b)=>(dYmd(a.data)+hm(a.hora))-(dYmd(b.data)+hm(b.hora))).forEach(a=>A.push({n:'verm',t:`<b>${esc(a.cliente)}</b> marcou ${a.data===h?'hoje':diaCurto(a.data)}${a.hora?' às '+esc(a.hora):''} e ainda não chegou.`,b:[{act:'waAg',id:a.id,l:'Chamar no WhatsApp'},{act:'go',v:'agendamento',id:a.id,l:'Abrir'}]}));
  oss().filter(o=>isOpen(o)&&o.previsao&&o.status!=='pronto'&&now>dYmd(o.previsao)+DIA).forEach(o=>A.push({n:'verm',t:`<b>${esc(o.modelo)} (${esc(o.placa)})</b> passou da previsão de entrega, que era ${diaCurto(o.previsao)}.`,b:[{act:'go',v:'os',id:o.id,l:'Abrir a ordem'}]}));
  p.pronto.filter(atrasado).forEach(o=>A.push({n:'ambar',t:`<b>${esc(o.modelo)} (${esc(o.placa)})</b> está pronto ${desde(o.statusEm||o.criadoEm)} e o cliente não buscou.`,b:[{act:'waPend',id:o.id,l:'Avisar o cliente'}]}));
  p.aprov.filter(o=>now-(o.statusEm||o.criadoEm)>DIA).forEach(o=>A.push({n:'ambar',t:`Orçamento de <b>${esc(o.cliente)}</b> esperando resposta ${desde(o.statusEm||o.criadoEm)}.`,b:[{act:'waPend',id:o.id,l:'Cobrar resposta'}]}));
  for(let i=0;i<7;i++){const s=addDias(h,i),c=capDia(s),u=usoDia(s);if(c>0&&u>c)A.push({n:'verm',t:`<b>${cap1(diaCurto(s))}</b> está lotado: ${fH(u)} de serviço para ${fH(c)} de capacidade.`,b:[{act:'agSemanaDe',d:s,l:'Ver a agenda'}]})}
  const am=ags().filter(a=>a.status==='agendado'&&a.data===addDias(h,1)).length;
  if(am)A.push({n:'info',t:`${am} ${am===1?'cliente marcado':'clientes marcados'} para amanhã. Mande o lembrete para confirmar.`,b:[{act:'agSemanaDe',d:addDias(h,1),l:'Ver agendamentos'}]});
  if(p.comprar.length)A.push({n:'ambar',t:`${p.comprar.length} ${p.comprar.length===1?'peça está acabando':'peças estão acabando'} no estoque.`,b:[{act:'go',v:'estoque',l:'Ver estoque'}]});
  if(p.fiado.length)A.push({n:'ambar',t:`${p.fiado.length} ${p.fiado.length===1?'fiado':'fiados'} para receber, somando ${brl(p.fiado.reduce((s,f)=>s+f.valor,0))}.`,b:[{act:'go',v:'pendencias',l:'Ver fiados'}]});
  const sp=Object.values(S.servicos).filter(s=>!+s.preco||!+s.horas).length;
  if(sp)A.push({n:'info',t:`${sp} ${sp===1?'serviço está':'serviços estão'} sem preço ou sem tempo de trabalho.`,b:[{act:'go',v:'servicos',l:'Arrumar'}]});
  return A;
}
function alertasHTML(max){
  const A=alertas(),L=max?A.slice(0,max):A;
  return `<section class="card"><h3>${I.alert}Alertas e ações ${A.length?`<span class="tag c-verm">${A.length}</span>`:''}</h3>

const tag=s=>`<span class="tag ${ST[s]?.c||'c-cinza'}">${ST[s]?.t||s}</span>`;
function cab(titulo,sub,{voltar:vo,acao}={}){

function banner(){return MODE==='local'&&!REMOTO?`<div class="banner">Modo de teste: os dados ficam guardados só neste aparelho. Na versão publicada, tudo fica salvo na nuvem.</div>`:''}
function metaBox(total){
  const meta=+S.config.meta||0;if(!meta)return '';
  const pct=Math.min(100,total/meta*100);
  return `<div><div class="row between"><b>Meta da semana: ${brl(meta)}</b><b>${Math.round(total/meta*100)}%</b></div>
  <div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <div class="${total>=meta?'up':'muted'}">${total>=meta?'Meta batida. Parabéns, equipe!':'Faltam '+brl(meta-total)+' para bater a meta'}</div></div>`;
}
function capBar(u,c,thin){if(!c)return `<div class="muted small">Fechado</div>`;const p=u/c*100,k=p>100?'r':p>=80?'a':'g';return `<div class="bar ${thin?'thin':''} ${k}"><i style="width:${Math.min(100,p)}%"></i></div>`}

function anel(p,rot){const r=58,C=2*Math.PI*r,v=Math.max(0,Math.min(100,p)),col=p>100&&rot.startsWith('ocup')?'#FF5A4F':'var(--brand)';
  return `<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="${Math.round(p)}% ${rot}"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--cinza-bg)" stroke-width="10"/><circle cx="75" cy="75" r="${r+10}" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 5"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 75 75)" style="filter:drop-shadow(0 0 6px ${col==='var(--brand)'?'var(--glow)':'rgba(255,80,70,.7)'})"/><text x="75" y="78" text-anchor="middle" font-family="Unbounded,Verdana,sans-serif" font-size="28" font-weight="600" fill="var(--ink)">${Math.round(p)}%</text><text x="75" y="100" text-anchor="middle" font-size="13" fill="var(--ink-2)">${rot}</text></svg>`}

function desenhaFios(){
  const cmd=$('#cmd'),svg=$('#wires'),hub=$('#hub');if(!cmd||!svg||!hub)return;
  if(getComputedStyle(svg).display==='none')return;
  const B=cmd.getBoundingClientRect(),H=hub.getBoundingClientRect(),rel=r=>({l:r.left-B.left,r:r.right-B.left,t:r.top-B.top,b:r.bottom-B.top,cx:r.left-B.left+r.width/2,cy:r.top-B.top+r.height/2});
  const hb=rel(H);let paths='',dots='';
  const clampX=x=>Math.max(hb.l+34,Math.min(hb.r-34,x));
  for(let n=1;n<=8;n++){const el=cmd.querySelector('.t'+n);if(!el)continue;const t=rel(el.getBoundingClientRect());let d,a,z;
    if(n<=3){const x=clampX(t.cx),my=(t.b+hb.t)/2;a=[t.cx,t.b];z=[x,hb.t];d=`M${t.cx},${t.b} V${my} H${x} V${hb.t}`}
    else if(n>=6){const x=clampX(t.cx),my=(t.t+hb.b)/2;a=[t.cx,t.t];z=[x,hb.b];d=`M${t.cx},${t.t} V${my} H${x} V${hb.b}`}
    else if(n===4){a=[t.r,t.cy];z=[hb.l,t.cy];d=`M${t.r},${t.cy} H${hb.l}`}
    else{a=[t.l,t.cy];z=[hb.r,t.cy];d=`M${t.l},${t.cy} H${hb.r}`}
    paths+=`<path class="w" d="${d}"/><path class="f" d="${d}" style="animation-delay:${-(n*0.41).toFixed(2)}s"/>`;
    dots+=`<circle class="d" cx="${a[0]}" cy="${a[1]}" r="3.5"/><circle class="d" cx="${z[0]}" cy="${z[1]}" r="3.5"/>`}
  svg.setAttribute('viewBox',`0 0 ${B.width} ${B.height}`);svg.innerHTML=paths+dots;
}
window.addEventListener('resize',()=>{clearTimeout(window._fw);window._fw=setTimeout(desenhaFios,120)});

    <input id="placa" data-b="chegou.placa" data-live="placa" value="${esc(c.placa)}" placeholder="ABC1D23" maxlength="8" autocomplete="off" autocapitalize="characters" style="font-size:30px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;max-width:360px">
    <div id="placa-info">${c.agendaId?'':placaInfo(c.placa)}</div>
  </section>
  <section class="card">
    <h3>Cliente e carro</h3>
    <div class="grid2">
      <div><label class="f">Nome do cliente</label><input data-b="chegou.cliente" value="${esc(c.cliente)}" autocomplete="off"></div>
      <div><label class="f">WhatsApp do cliente</label><input data-b="chegou.telefone" value="${esc(c.telefone)}" inputmode="tel" placeholder="(86) 99999-9999" autocomplete="off"></div>
      <div><label class="f">Modelo do carro</label><input data-b="chegou.modelo" value="${esc(c.modelo)}" placeholder="Ex.: Gol 1.0" autocomplete="off"></div>
      <div><label class="f">Ano</label><input data-b="chegou.ano" value="${esc(c.ano)}" inputmode="numeric" autocomplete="off"></div>
      <div><label class="f">Cor</label><input data-b="chegou.cor" value="${esc(c.cor)}" autocomplete="off"></div>
      <div><label class="f">Quilometragem</label><input data-b="chegou.km" value="${esc(c.km)}" inputmode="numeric" autocomplete="off"></div>
    </div>
    <label class="f">O que o cliente falou do problema?</label>
    <textarea data-b="chegou.queixa" placeholder="Ex.: barulho na roda da frente quando freia">${esc(c.queixa)}</textarea>
    <div id="audio-box">${audioBox()}</div>
  </section>
  <section class="card"><h3>${I.wrench}Quais serviços vão ser feitos?</h3>
    <p class="muted small">Toque nos serviços para marcar. Se ainda não souber tudo, marque o que já sabe e escreva o resto na observação abaixo.</p>
    ${chegouServicos(c)}
    <label class="f">Observação sobre o serviço (opcional)</label>
    <textarea data-b="chegou.obsServico" placeholder="Ex.: verificar também a suspensão. Se achar outro problema, avisar o cliente antes de fazer.">${esc(c.obsServico)}</textarea>
  </section>
  <section class="card"><h3>${I.clock}Entrega e combustível</h3>
    <div class="grid2"><div><label class="f" style="margin-top:0">Previsão de entrega</label><input type="date" data-b="chegou.previsao" value="${esc(c.previsao)}"></div></div>
    <label class="f">Combustível no tanque</label>
    <div class="seg">${fuel.map(([v,t])=>`<button class="${c.combustivel===v?'on':''}" data-act="setDraft" data-k="chegou.combustivel" data-v="${v}">${t}</button>`).join('')}</div>
    ${mecs.length?`<label class="f">Qual mecânico vai pegar?</label><div class="seg">${mecs.map(m=>`<button class="${c.mecanicoId===m.id?'on':''}" data-act="setDraft" data-k="chegou.mecanicoId" data-v="${m.id}">${esc(m.nome)}</button>`).join('')}</div>`:''}
  </section>
  <section class="card">
    <h3>Fotos do carro na chegada</h3>
    <p class="muted small">Tire fotos de arranhões e amassados. Isso protege a oficina de reclamação depois.</p>
    <div class="fotos">${c.fotos.map((f,i)=>`<div class="f"><img src="${f}" alt="Foto ${i+1}" data-act="zoom"><button data-act="fotoDel" data-i="${i}" aria-label="Apagar foto">×</button></div>`).join('')}</div>
    ${c.fotos.length<4?`<label class="btn sec" style="margin-top:12px">${I.camera}Tirar foto<input type="file" accept="image/*" capture="environment" data-chg="foto" style="display:none"></label>`:'<p class="muted small">Máximo de 4 fotos.</p>'}
  </section>
  <section class="card">
    <div class="row between"><h3 style="margin:0">Assinatura do cliente</h3><button class="btn sec sm" data-act="sigClear">Limpar</button></div>
    <canvas id="sig" class="sig" style="margin-top:10px" aria-label="Espaço para o cliente assinar com o dedo"></canvas>
  </section>
  <div style="margin-top:18px"><button class="btn big ok" data-act="salvarEntrada">Registrar entrada</button></div>`;
};
function audioBox(){
  const c=D.chegou,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(REC)return `<div class="row" style="margin-top:12px"><button class="btn rec" data-act="recStop">${I.mic}${REC.tipo==='texto'?'Parar de ouvir':'Parar gravação'} <span id="rec-t">0:00</span></button><span class="muted">${REC.tipo==='texto'?'Fale agora. O que você disser vira texto acima.':'Gravando. Fale o problema do carro (até 1 minuto).'}</span></div>`;
  return `<div class="row" style="margin-top:12px">${c.audio?'':`<button class="btn sec" data-act="recStart">${I.mic}Explicar por áudio</button>`}${SR?`<button class="btn sec" data-act="recTexto">${I.mic}Falar e virar texto</button>`:''}</div>
  ${c.audio?`<div class="cap"><b>Áudio gravado</b><audio controls src="${c.audio}"></audio><div><button class="btn danger sm" style="margin-top:8px" data-act="recDel">Apagar áudio</button></div></div>`:''}`;
}
function chegouServicos(c){
  const servs=Object.values(S.servicos).sort((a,b)=>a.nome.localeCompare(b.nome)),its=c.itens||[];
  const livres=its.map((i,k)=>[i,k]).filter(([i])=>!i.sid||!S.servicos[i.sid]);
  const hs=hItens(its),vl=its.reduce((s,i)=>s+(+i.preco||0),0);
  return `${servs.length?`<div class="chips">${servs.map(s=>`<button class="chip ${its.some(i=>i.sid===s.id)?'on':''} ${+s.preco?'':'semPreco'}" data-act="chSrv" data-s="${s.id}">${esc(s.nome)}<small>${+s.horas?fH(s.horas)+', ':''}${+s.preco?brl(s.preco):'sem preço'}</small></button>`).join('')}</div>`:'<p class="muted">Nenhum serviço cadastrado ainda. Use o campo abaixo ou cadastre em Serviços.</p>'}
  ${livres.map(([i,k])=>`<div class="item"><div class="nome">${esc(i.nome)}<small>Serviço escrito à mão</small></div><b>${brl(i.preco)}</b><button class="x" data-act="chRm" data-i="${k}" aria-label="Tirar">×</button></div>`).join('')}
  <div class="row" style="margin-top:12px;align-items:flex-end"><div style="flex:2 1 220px"><label class="f">Outro serviço</label><input data-b="chLivre.nome" value="${esc(D.chLivre.nome)}" placeholder="Nome do serviço"></div><div style="flex:1 1 120px"><label class="f">Preço</label><input data-b="chLivre.preco" value="${esc(D.chLivre.preco)}" inputmode="decimal" placeholder="0,00"></div><button class="btn sec" data-act="chLivre">${I.plus}Adicionar</button></div>
  ${its.length?`<div class="cap row between"><span><b>${its.length} ${its.length===1?'serviço':'serviços'}</b>${hs?', '+fH(hs)+' de trabalho':''}</span><b class="money" style="font-size:24px">${brl(vl)}</b></div>`:''}`;
}
function placaInfo(p){
  p=normPlaca(p);if(p.length<7)return '';
  const v=S.veiculos[p],aberta=oss().find(o=>o.placa===p&&isOpen(o));
  const agd=ags().find(a=>a.placa===p&&a.status==='agendado');
  let h='';
  if(aberta)h+=`<div class="banner" style="margin-top:12px">Este carro já está na oficina (ordem nº ${aberta.numero}). <button class="btn sec sm" data-act="go" data-v="os" data-id="${aberta.id}" style="margin-left:8px">Abrir a ordem</button></div>`;
  if(agd)h+=`<div class="banner info" style="margin-top:12px">Este carro tem agendamento ${diaCurto(agd.data)} às ${esc(agd.hora)}. <button class="btn sm" data-act="agChegou" data-id="${agd.id}" style="margin-left:8px">Usar o agendamento</button></div>`;
  if(v){const vs=visitas(p);h+=`<div class="cap bom"><b>Cliente já conhecido</b><div style="color:var(--ink)">${esc(v.cliente)}, ${esc(v.modelo)}</div><div class="small">${vs.length} ${vs.length===1?'visita':'visitas'}${vs[0]?', última em '+fData(vs[0].entregueEm):''}</div></div>`}
  else h+=`<p class="muted" style="margin-top:10px">Carro novo. Preencha os dados abaixo.</p>`;
  return h;
}

VIEWS.guia=({tipo,id})=>{
  const o=tipo==='venda'?S.vendas[id]:S.os[id];if(!o)return cab('Guia')+'<p>Não encontrei este registro.</p>';
  return `${cab(tipo==='entrada'?'Entrada registrada':tipo==='saida'?'Saída registrada':'Venda registrada','',{voltar:{act:'go',v:'inicio',l:'Início'}})}
  <div class="row" style="margin-bottom:16px">
    <button class="btn ok" data-act="pdfGuia" data-t="${tipo}" data-id="${id}">${I.wa}Enviar PDF no WhatsApp</button>
    <button class="btn sec" data-act="waGuia" data-t="${tipo}" data-id="${id}">${I.wa}Só a mensagem</button>
    <button class="btn sec" data-act="baixarPdf" data-t="${tipo}" data-id="${id}">${I.print}Baixar PDF</button>
    <button class="btn sec" data-act="imprimir">${I.print}Imprimir</button>
    ${tipo==='entrada'?`<button class="btn sec" data-act="go" data-v="os" data-id="${id}">Abrir a ordem de serviço</button>`:''}
  </div>
  ${guiaHTML(tipo,o)}`;
};
function guiaHTML(tipo,o){
  const cb=`<div class="row between"><div><h2>${esc(S.config.oficina||'Auto Center')}</h2>${S.config.endereco?`<div>${esc(S.config.endereco)}</div>`:''}${S.config.telefone?`<div>${esc(S.config.telefone)}</div>`:''}</div><div style="text-align:right"><b>${tipo==='entrada'?'GUIA DE ENTRADA':tipo==='saida'?'GUIA DE SAÍDA':'COMPROVANTE DE VENDA'}</b><div>${tipo==='venda'?'':'Ordem nº '+o.numero}</div><div>${fHora(tipo==='saida'?o.entregueEm:o.criadoEm)}</div></div></div><hr>`;
  const itens=it=>`<table><thead><tr><th>Item</th><th class="n">Qtd</th><th class="n">Valor</th><th class="n">Total</th></tr></thead><tbody>${(it||[]).map(i=>`<tr><td>${esc(i.nome)}</td><td class="n">${i.qtd}</td><td class="n">${brl(i.preco)}</td><td class="n">${brl(i.qtd*i.preco)}</td></tr>`).join('')}</tbody></table>`;
  if(tipo==='venda')return `<div class="guia">${cb}${o.cliente?`<p><b>Cliente:</b> ${esc(o.cliente)}</p>`:''}${itens(o.itens)}<div class="gtotal">Total: ${brl(o.total)}</div><p><b>Pagamento:</b> ${PAG[o.pagamento]||''}</p></div>`;
  const carro=`<table><tbody><tr><td><b>Placa</b></td><td>${esc(o.placa)}</td><td><b>Carro</b></td><td>${esc(o.modelo)} ${esc(o.ano||'')} ${esc(o.cor||'')}</td></tr><tr><td><b>Cliente</b></td><td>${esc(o.cliente)}</td><td><b>WhatsApp</b></td><td>${esc(o.telefone)}</td></tr><tr><td><b>Km</b></td><td>${esc(o.km)}</td><td><b>Combustível</b></td><td>${esc(o.combustivel||'-')}</td></tr></tbody></table>`;
  if(tipo==='entrada')return `<div class="guia">${cb}${carro}<p style="margin-top:12px"><b>Problema relatado:</b> ${esc(o.queixa||(o.temAudio?'explicado por áudio (fica guardado na ordem)':'-'))}</p>${o.obsServico?`<p><b>Observação sobre o serviço:</b> ${esc(o.obsServico)}</p>`:''}${(o.itens||[]).length?`<p><b>Serviços combinados:</b> ${o.itens.map(i=>esc(i.nome)).join(', ')} (${brl(tot(o))})</p>`:''}${o.previsao?`<p><b>Previsão de entrega:</b> ${fData(dYmd(o.previsao))}</p>`:''}${o.mecanicoId?`<p><b>Mecânico:</b> ${esc(nomeFunc(o.mecanicoId))}</p>`:''}<div class="aviso">${esc(aviso())}</div><p class="small" style="margin-top:10px">O cliente declara que o veículo foi entregue nas condições acima e concorda com o aviso de serviço adicional.</p>${o.assinatura?`<img class="assin" src="${o.assinatura}" alt="Assinatura do cliente">`:'<div class="assin" style="height:60px"></div>'}<div class="small">Assinatura do cliente</div></div>`;
  return `<div class="guia">${cb}${carro}<h3 style="margin-top:14px">Serviços e peças</h3>${itens(o.itens)}${+o.desconto?`<div style="text-align:right">Desconto: ${brl(o.desconto)}</div>`:''}<div class="gtotal">Total: ${brl(tot(o))}</div><p><b>Pagamento:</b> ${PAG[o.pagamento]||''}</p>${o.garantiaDias?`<p><b>Garantia do serviço:</b> ${o.garantiaDias} dias, até ${fData(o.entregueEm+o.garantiaDias*DIA)}</p>`:''}${o.proxRevisao?`<p><b>Próxima revisão:</b> ${fData(o.proxRevisao)}${o.proxKm?' ou aos '+esc(o.proxKm)+' km':''}</p>`:''}<p class="small">Obrigado pela preferência!</p></div>`;
}
function textoGuia(tipo,o){
  const of=S.config.oficina||'Auto Center';
  if(tipo==='entrada')return `Olá, ${o.cliente}! Recebemos seu ${o.modelo} (placa ${o.placa}) em ${fHora(o.criadoEm)}.\nOrdem de serviço nº ${o.numero}.\nProblema relatado: ${o.queixa||(o.temAudio?'explicado por áudio':'-')}\n${(o.itens||[]).length?'Serviços combinados: '+o.itens.map(i=>i.nome).join(', ')+' ('+brl(tot(o))+')\n':''}${o.previsao?'Previsão de entrega: '+fData(dYmd(o.previsao))+'\n':''}\n⚠️ ${aviso()}\n\nVamos te avisar por aqui quando estiver pronto.\n${of}`;
  const lin=(o.itens||[]).map(i=>`• ${i.nome}${i.qtd>1?' ('+i.qtd+'x)':''}: ${brl(i.qtd*i.preco)}`).join('\n');
  if(tipo==='venda')return `Comprovante de compra – ${of}\n${lin}\nTotal: ${brl(o.total)}\nPagamento: ${PAG[o.pagamento]||''}\nObrigado!`;
  return `Olá, ${o.cliente}! Seu ${o.modelo} (placa ${o.placa}) foi entregue.\n\n${lin}\n${+o.desconto?'Desconto: '+brl(o.desconto)+'\n':''}*Total: ${brl(tot(o))}*\nPagamento: ${PAG[o.pagamento]||''}\n${o.garantiaDias?`Garantia: ${o.garantiaDias} dias (até ${fData(o.entregueEm+o.garantiaDias*DIA)})\n`:''}${o.proxRevisao?`Próxima revisão: ${fData(o.proxRevisao)}\n`:''}\nObrigado pela preferência!\n${of}`;
}

VIEWS.oficina=()=>{
  const ab=oss().filter(isOpen).sort((a,b)=>a.criadoEm-b.criadoEm);
  return `${cab('Carros na oficina',ab.length+(ab.length===1?' carro agora':' carros agora'),{acao:`<button class="btn" data-act="novaEntrada">${I.chegou}Carro chegou</button>`})}
  ${ab.length?`<div class="dica">${I.oficina}<span>Para organizar o pátio: segure o carro e arraste para outra coluna, ou para cima e para baixo. No computador, é só clicar e arrastar.</span></div><div class="kanban">${ORDEM.map(s=>{const l=ab.filter(o=>o.status===s).sort(porOrdem);return `<section class="col" data-col="${s}"><h3>${tag(s)}<span>${l.length}</span></h3>${l.length?l.map(o=>cardCarro(o,true)).join(''):'<div class="empty">Arraste um carro para cá</div>'}</section>`}).join('')}</div>`
  :`<div class="card empty-big">${I.oficina}<p>Nenhum carro na oficina agora.</p><button class="btn" data-act="novaEntrada">Registrar um carro que chegou</button></div>`}`;
};
const porOrdem=(a,b)=>((a.ordem??1e13+a.criadoEm)-(b.ordem??1e13+b.criadoEm));
function cardCarro(o,drag){
  const late=atrasado(o);
  return `<button class="carcard ${late?'late':''}" data-act="go" data-v="os" data-id="${o.id}" ${drag?`data-drag="${o.id}"`:''}>
    ${drag?'<span class="grip" aria-hidden="true">⋮⋮</span>':''}<div class="row between">${placa(o.placa,'sm')}<span class="small muted">nº ${o.numero}</span></div>
    <div class="l"><b>${esc(o.modelo)}</b></div>
    <div class="l">${esc(o.cliente)}</div>
    ${o.mecanicoId?`<div class="l muted">Mecânico: ${esc(nomeFunc(o.mecanicoId))}</div>`:''}
    ${hItens(o.itens)?`<div class="l muted">${fH(hItens(o.itens))} de trabalho</div>`:''}
    <div class="l ${late?'down':'muted'}">${o.previsao?'Entrega: '+diaCurto(o.previsao):'Chegou '+desde(o.criadoEm)}${late?' (atrasado)':''}</div>
  </button>`;
}

VIEWS.os=({id})=>{
  const o=S.os[id];if(!o)return cab('Ordem de serviço','',{voltar:{act:'go',v:'oficina',l:'Oficina'}})+'<p>Não encontrei esta ordem.</p>';
  const mecs=Object.values(S.funcionarios).filter(f=>f.funcao==='mecanico');
  const servs=Object.values(S.servicos).sort((a,b)=>a.nome.localeCompare(b.nome));
  const aberta=isOpen(o);
  return `${cab('Ordem nº '+o.numero,o.agendaId?'Veio de um agendamento':'',{voltar:{act:'go',v:'oficina',l:'Oficina'}})}
  <section class="card"><div class="row">${placa(o.placa)}<div><b style="font-size:22px">${esc(o.modelo)}</b><div>${esc(o.cliente)}${o.telefone?', '+esc(o.telefone):''}</div><div class="muted small">Chegou em ${fHora(o.criadoEm)} (${desde(o.criadoEm)})</div></div></div>
  ${o.queixa?`<p style="margin-top:12px"><b>Problema relatado:</b> ${esc(o.queixa)}</p>`:''}
  ${o.obsServico?`<div class="banner info" style="margin:10px 0 0">Observação sobre o serviço: ${esc(o.obsServico)}</div>`:''}
  ${aberta?`<div class="row" style="margin-top:10px"><label for="prev"><b>Previsão de entrega</b></label><input id="prev" type="date" value="${esc(o.previsao||'')}" data-chg="previsaoOS" data-id="${id}" style="width:auto"></div>`:''}
  <div id="audio-os"></div>
  <div id="fotos-os" class="fotos"></div>
  ${aberta?`<button class="evo-cta" data-act="evoAbrir" data-p="${esc(o.placa)}"><i></i><span>Perguntar ao EVO sobre este carro<small>Ele já sabe o problema, o histórico e as anotações deste carro</small></span></button>`:''}</section>
  ${notasHTML(o,aberta)}
  ${aberta?`<section class="card"><h3>Como está o carro agora?</h3>
  <div class="seg status">${ORDEM.map(s=>`<button class="${o.status===s?'on '+ST[s].b:''}" data-act="setStatus" data-id="${id}" data-v="${s}">${ST[s].t}</button>`).join('')}</div>
  ${mecs.length?`<label class="f">Mecânico responsável</label><div class="seg">${mecs.map(m=>`<button class="${o.mecanicoId===m.id?'on':''}" data-act="setMec" data-id="${id}" data-v="${m.id}">${esc(m.nome)}</button>`).join('')}</div>`:''}
  </section>`:`<div class="banner" style="margin-top:14px">Esta ordem está ${ST[o.status].t.toLowerCase()}${o.entregueEm?' desde '+fHora(o.entregueEm):''}.</div>`}
  <section class="card"><div class="row between"><h3 style="margin:0">Serviços e peças</h3>${hItens(o.itens)?`<span class="muted">${fH(hItens(o.itens))} de trabalho</span>`:''}</div>
    ${(o.itens||[]).length?(o.itens.map((i,k)=>`<div class="item"><div class="nome">${esc(i.nome)}<small>${i.tipo==='peca'?'Peça':'Serviço'+(+i.horas?', '+fH(i.horas):'')}</small></div>
      ${aberta?`<div class="step"><button data-act="qtd" data-id="${id}" data-i="${k}" data-d="-1" aria-label="Menos">−</button><span>${i.qtd}</span><button data-act="qtd" data-id="${id}" data-i="${k}" data-d="1" aria-label="Mais">+</button></div>
      <input class="preco" inputmode="decimal" value="${(+i.preco).toFixed(2).replace('.',',')}" data-chg="precoItem" data-id="${id}" data-i="${k}" aria-label="Preço">
      <b style="min-width:110px;text-align:right">${brl(i.qtd*i.preco)}</b><button class="x" data-act="rmItem" data-id="${id}" data-i="${k}" aria-label="Tirar">×</button>`
      :`<span>${i.qtd} × ${brl(i.preco)}</span><b>${brl(i.qtd*i.preco)}</b>`}</div>`).join('')):'<p class="muted" style="margin-top:10px">Nenhum serviço ou peça ainda. Adicione abaixo.</p>'}
    <div class="row between" style="margin-top:14px"><div class="row"><label for="desc"><b>Desconto (R$)</b></label><input id="desc" class="preco" inputmode="decimal" value="${+o.desconto?(+o.desconto).toFixed(2).replace('.',','):''}" data-chg="desconto" data-id="${id}" ${aberta?'':'disabled'}></div><div class="total money">${brl(tot(o))}</div></div>
  </section>
  ${aberta?`<section class="card"><h3>${I.wrench}Adicionar serviço</h3>

    <div class="row" style="margin-top:14px;align-items:flex-end"><div style="flex:2 1 220px"><label class="f">Outro serviço</label><input data-b="livre.nome" value="${esc(D.livre.nome)}" placeholder="Nome do serviço"></div><div style="flex:1 1 120px"><label class="f">Preço</label><input data-b="livre.preco" value="${esc(D.livre.preco)}" inputmode="decimal" placeholder="0,00"></div><button class="btn" data-act="addLivre" data-id="${id}">Adicionar</button></div>

function resultadosPeca(q,act,id){

VIEWS.agenda=()=>{
  const q=D.agBusca.trim().toLowerCase(),f=D.agFiltro,h=hoje();
  let L=ags();
  if(q)L=L.filter(a=>(a.cliente||'').toLowerCase().includes(q)||(a.placa||'').toLowerCase().includes(normPlaca(q).toLowerCase()||'#')||(a.modelo||'').toLowerCase().includes(q));
  if(f==='proximos')L=L.filter(a=>a.status==='agendado');
  else if(f==='chegou')L=L.filter(a=>a.status==='chegou');

  L.sort((a,b)=>f==='todos'||f==='chegou'?(b.data+b.hora).localeCompare(a.data+a.hora):(a.data+a.hora).localeCompare(b.data+b.hora));
  const ativos=ags().filter(a=>a.status==='agendado').length;
  return `${cab('Agenda',`${ativos} ${ativos===1?'agendamento marcado':'agendamentos marcados'}`,{acao:`<button class="btn" data-act="novoAg">${I.plus}Novo agendamento</button>`})}
  <div class="grid2" style="gap:12px;align-items:center"><input data-b="agBusca" data-live="render" value="${esc(D.agBusca)}" placeholder="Procurar por cliente, placa ou modelo" autocomplete="off">
  <div class="seg inline">${[['proximos','Marcados'],['chegou','Chegaram'],['cancelado','Cancelados'],['todos','Todos']].map(([k,t])=>`<button class="${f===k?'on':''}" data-act="setDraft" data-k="agFiltro" data-v="${k}">${t}</button>`).join('')}</div></div>
  <section class="card" style="margin-top:14px">${L.length?L.slice(0,60).map(a=>agLinha(a)).join(''):`<div class="empty-big">${I.agenda}<p>Nenhum agendamento encontrado.</p><button class="btn" data-act="novoAg">${I.plus}Agendar um serviço</button></div>`}</section>

function semanaHTML(){
  const w0=semana0()+D.agSem*7*DIA,h=hoje(),m=fDM(w0)+' a '+fDM(w0+6*DIA)+(D.agSem===0?' (esta semana)':'');
  const dias=[...Array(7)].map((_,i)=>ymd(w0+i*DIA+3600e3));
  return `<section class="card"><div class="row between" style="margin-bottom:14px"><div class="row"><button class="icon-btn" data-act="agSem" data-d="-1" aria-label="Semana anterior">${I.left}</button><button class="icon-btn" data-act="agSem" data-d="1" aria-label="Próxima semana">${I.right}</button><button class="btn sec sm" data-act="agSem" data-d="0">${I.agenda}Hoje</button></div><b style="font-size:21px">${m}</b></div>
  <div class="semana-wrap"><div class="semana">${dias.map(s=>{
    const c=capDia(s),u=usoDia(s),wd=new Date(dYmd(s)).getDay();
    const L=ags().filter(a=>a.data===s&&agAtivo(a)).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    const W=oss().filter(o=>!o.agendaId&&o.status!=='cancelado'&&ymd(o.criadoEm)===s);
    return `<div class="dia ${s===h?'hoje':''}"><div class="dh"><span>${DSEM[wd]}</span><b>${new Date(dYmd(s)).getDate()}</b></div>
    <div class="dc">${capBar(u,c,true)}${c?`<span class="${u>c?'down':'muted'}">${fH(u)} de ${fH(c)}</span>`:''}</div>
    <div class="db">${L.map(a=>`<button class="ag ${a.status==='chegou'?'chegou':agAtrasado(a)?'late':'agendado'}" data-act="go" data-v="agendamento" data-id="${a.id}"><b>${a.hora?esc(a.hora):'Sem hora'}</b> ${esc(a.placa||a.modelo||'')}<br>${esc(a.cliente)}<br><span class="muted">${(a.itens||[]).length?fH(hItens(a.itens))+', '+a.itens.map(i=>esc(i.nome)).join(', '):esc(a.modelo||'')}</span></button>`).join('')}
    ${W.map(o=>`<button class="ag walk" data-act="go" data-v="os" data-id="${o.id}"><b>Sem hora</b> ${esc(o.placa)}<br>${esc(o.cliente)}<br><span class="muted">Chegou sem agendar${hItens(o.itens)?', '+fH(hItens(o.itens)):''}</span></button>`).join('')}
    ${!L.length&&!W.length?'<div class="empty">—</div>':''}
    ${c&&s>=h?`<button class="addday" data-act="novoAg" data-d="${s}">+ Agendar</button>`:''}</div></div>`}).join('')}</div></div>
  <p class="muted small" style="margin-top:10px">A barra mostra as horas de serviço marcadas no dia. Verde tem vaga, amarelo está quase cheio, vermelho passou da capacidade.</p></section>`;
}

    <label class="f">Para quando?</label>
    <div class="seg inline">${quick.map(s=>`<button class="${a.data===s?'on':''}" data-act="agDia" data-d="${s}">${cap1(diaCurto(s))}</button>`).join('')}</div>
    <div class="grid2"><div><label class="f">Outro dia</label><input type="date" value="${esc(a.data)}" data-chg="agData"></div><div><label class="f">Horário <span class="muted">(se combinou)</span></label><input type="time" data-b="ag.hora" value="${esc(a.hora)}"></div></div>
    <label class="f">O que o cliente falou? <span class="muted">(se falou)</span></label>

  </section>

  ${a.mais?`<section class="card"><h3>${I.wrench}Serviços já combinados</h3>
    ${servs.length?`<div class="chips">${servs.map(s=>`<button class="chip ${a.sids.includes(s.id)?'on':''}" data-act="agSrv" data-s="${s.id}">${esc(s.nome)}<small>${+s.horas?fH(s.horas):'sem tempo'}, ${+s.preco?brl(s.preco):'sem preço'}</small></button>`).join('')}</div>`:'<p class="muted">Nenhum serviço cadastrado.</p>'}
    ${sel.length?`<div class="cap row between"><span><b>${sel.length} ${sel.length===1?'serviço':'serviços'}</b>, ${fH(hs)}</span><b class="money">${brl(vl)}</b></div>`:''}
    ${capTxt}
    <div class="grid2"><div><label class="f">Previsão de entrega</label><input type="date" value="${esc(a.previsao||a.data)}" data-chg="agPrev"></div></div>

    <label class="f">Pagamento combinado</label><div class="seg">${Object.entries(PAG).map(([k,t])=>`<button class="${a.pagamento===k?'on':''}" data-act="setDraft" data-k="ag.pagamento" data-v="${a.pagamento===k?'':k}">${t}</button>`).join('')}</div>

function sugCli(q){

  const r=Object.values(S.clientes).filter(c=>(c.nome||'').toLowerCase().includes(q)).slice(0,5);
  if(!r.length)return '';
  return `<span class="muted small">Já é cliente? Toque para preencher:</span>`+r.map(c=>`<button class="chip" data-act="agCli" data-id="${c.id}">${esc(c.nome)}<small>${carrosDo(c.id).map(v=>esc(v.modelo)+' '+esc(v.placa)).join(', ')||'sem carro'}${c.telefone?', '+esc(c.telefone):''}</small></button>`).join('');
}
function resultadosCli(q){return sugCli(q)}
VIEWS.agendamento=({id})=>{

  const [st,cl]=agStatus(a),its=a.itens||[];
  return `${cab('Agendamento',`${cap1(diaCurto(a.data))}${a.hora?' às '+esc(a.hora):', sem horário'}`,{voltar:{act:'go',v:'agenda',l:'Agenda'}})}

    <div class="row">${a.telefone?`<button class="btn sec" data-act="waAg" data-id="${id}">${I.wa}Lembrar no WhatsApp</button>`:''}<button class="btn sec" data-act="agEditar" data-id="${id}">Mudar dia ou dados</button><button class="btn sec" data-act="agFaltou" data-id="${id}">O cliente não veio</button></div>`

  ${a.status!=='chegou'?`<button class="btn danger" data-act="agExcluir" data-id="${id}">${I.lixo}Excluir este agendamento</button>`:''}
